[extend]
useDefault = true

# Khi thêm ngoại lệ, dùng allowlist theo đường dẫn fixture và ghi lý do.

# generic-api-key captures this exact prose fragment in PID-00009/qc-report.md
# (commit add5003, line 18). It is a test-status label, not credential material.
# Match only the captured value, retaining all other secret/history checks.
[allowlist]
description = "False positive: the literal QC label skipped/concurrency"
regexes = ['''^skipped/concurrency$''']
