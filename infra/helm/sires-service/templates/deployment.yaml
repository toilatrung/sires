apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service }}
  labels:
    app.kubernetes.io/name: {{ .Values.service }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.service }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.service }}
    spec:
      containers:
        - name: {{ .Values.service }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: PORT
              value: "{{ .Values.port }}"
          ports:
            - containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.port }}
