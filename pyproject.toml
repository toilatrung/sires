# uv workspace for the Python services (architecture 3.4, ADR-21). Virtual root: no package here.
[tool.uv.workspace]
members = ["apps/agent-core", "apps/knowledge", "libs/py/sires_common", "eval"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
# The license header (scripts/docs/add-license.mjs) has a 111-character line.
line-length = 120
target-version = "py312"
# Ruff runs from each project's folder but reads this file; list the source roots so workspace packages sort as first-party.
src = ["apps/agent-core/src", "apps/knowledge/src", "libs/py/sires_common/src", "eval/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
