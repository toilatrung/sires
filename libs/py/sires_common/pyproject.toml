[project]
name = "sires-common"
version = "0.0.0"
description = "SIRes shared library for Python services"
requires-python = ">=3.12,<3.13"
# No provider SDK here: agent-core and knowledge import the ModelGateway interface without pulling one (architecture 3.6).
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "structlog>=24.4",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "asyncpg>=0.30",
  "aio-pika>=9.4",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "attrs>=25.3",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
# sires_common.testing.fixtures (pytest plugin): PostgreSQL, RabbitMQ, MinIO in Testcontainers.
testing = [
  "pytest>=8",
  "testcontainers[postgres,rabbitmq,minio]>=4.8",
]

[dependency-groups]
dev = [
  "sires-common[testing]",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "rfc3339-validator>=0.1.4",
  "pyyaml>=6",
  "asyncpg-stubs>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sires_common"]

[tool.hatch.build]
artifacts = ["src/sires_common/generated/**"]

# Generated clients are checked by import/operation coverage tests, not handwritten-code style rules.
[tool.ruff]
extend = "../../../pyproject.toml"
extend-exclude = ["src/sires_common/generated"]

[tool.ruff.lint.isort]
known-first-party = ["sires_common"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["src/sires_common/generated/"]

[[tool.mypy.overrides]]
module = "sires_common.generated.*"
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
