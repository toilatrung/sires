[project]
name = "sires-common"
version = "0.0.0"
description = "SIRes shared library for Python services"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sires_common"]
