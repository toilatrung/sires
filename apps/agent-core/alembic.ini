# Alembic of agent-core (architecture 6.10, D1): SQL revisions copied from docs/database/ddl, run on SQLAlchemy async
# and asyncpg, forward only. The DSN comes from DATABASE_MIGRATOR_URL (agent_core.config), never from this file.
# Run from the repository root (the image's /repo) or from apps/agent-core: paths below are relative to this file.
#   uv run --no-sync alembic -c apps/agent-core/alembic.ini upgrade head

[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
