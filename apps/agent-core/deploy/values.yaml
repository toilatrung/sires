# Giá trị Helm riêng của service (quy tắc 1.4.8); chart chung ở infra/helm/sires-service.
service: agent-core
image:
  repository: sires/agent-core
  tag: latest
port: 8101
replicas: 2
# Job migration của chart chung (PID-00010 S02) chạy lệnh này trong image của service trước Deployment (H3, D1).
# Lệnh chạy từ WORKDIR /repo của infra/docker/python/Dockerfile, chỉ dùng phụ thuộc chạy (EC07); DSN của migrator
# lấy từ biến DATABASE_MIGRATOR_URL. Chạy lại khi đã ở head không làm gì (EC02). Kiểu giá trị (danh sách argv)
# kiểm lại khi chart của PID-00010 có trên main.
migration:
  enabled: true
  command: ["uv", "run", "--no-sync", "alembic", "-c", "apps/agent-core/alembic.ini", "upgrade", "head"]
