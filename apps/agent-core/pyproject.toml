[project]
name = "sires-agent-core"
version = "0.0.0"
description = "SIRes agent-core service (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sires-common",
]

[tool.uv.sources]
sires-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
