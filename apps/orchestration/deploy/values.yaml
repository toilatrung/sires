# Giá trị Helm riêng của service (quy tắc 1.4.8); chart chung ở infra/helm/sires-service.
service: orchestration
image:
  repository: sires/orchestration
  tag: latest
port: 3104
replicas: 2
# Job migration của chart chung (PID-00010 S02) chạy lệnh này trong image của service trước Deployment
# (PID-00019 S04; kiến trúc 6.10, D1). Lệnh chạy từ WORKDIR /app của infra/docker/node/Dockerfile, chỉ dùng
# migrate() của drizzle-orm có trong image (không cần drizzle-kit, EC09); DSN của vai trò migrator lấy từ biến
# DATABASE_MIGRATOR_URL. Chạy lại khi đã ở bản mới nhất không làm gì (EC02). Chart chung nhận command là danh sách
# argv (infra/helm/sires-service/templates/migration-job.yaml).
migration:
  enabled: true
  command: ["node", "dist/migrate.js"]
