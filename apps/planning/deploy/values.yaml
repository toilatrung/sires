# Giá trị Helm riêng của service (quy tắc 1.4.8); chart chung ở infra/helm/sires-service.
service: planning
image:
  repository: sires/planning
  tag: latest
port: 3103
replicas: 2
# Job migration của chart chung (PID-00010 S02) chạy lệnh này trong image của service trước Deployment
# (PID-00023 S07; kiến trúc 6.10, H1, H6). Lệnh chạy từ WORKDIR /app của infra/docker/node/Dockerfile, chỉ dùng
# migrate() của drizzle-orm có trong image (không cần drizzle-kit, EC25); DSN của vai trò migrator lấy từ biến
# DATABASE_MIGRATOR_URL. Chạy lại khi đã ở bản mới nhất không làm gì (EC01).
migration:
  enabled: true
  command: ["node", "dist/migrate.js"]
