[project]
name = "sires-knowledge"
version = "0.0.0"
description = "SIRes knowledge service (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sires-common",
]

[dependency-groups]
# Spike SPK-04 (spikes/spk_04, PID-00027): numpy for synthetic vectors; its tests run PostgreSQL in Testcontainers.
# Development only: the service wheel packages src/knowledge alone (see tool.hatch below).
dev = [
  "numpy>=2.1",
  "sires-common[testing]",
]

[tool.uv.sources]
sires-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]
