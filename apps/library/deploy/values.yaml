# Giá trị Helm riêng của service (quy tắc 1.4.8); chart chung ở infra/helm/sires-service.
service: library
image:
  repository: sires/library
  tag: latest
port: 3105
replicas: 2
# Job migration của chart chung (PID-00010 S02) chạy lệnh này trong image của service trước Deployment
# (PID-00024 S01, H5, H6; kiến trúc 6.10). Lệnh chạy từ WORKDIR /app của infra/docker/node/Dockerfile, chỉ dùng
# migrate() của drizzle-orm có trong image (không cần drizzle-kit, PID-00010 EC01); DSN của vai trò migrator lấy từ
# biến DATABASE_MIGRATOR_URL. Chạy lại khi đã ở bản mới nhất không làm gì (EC03).
migration:
  enabled: true
  command: ["node", "dist/migrate.js"]
