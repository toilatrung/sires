# Pull request CI (architecture 11.3): affected projects only. Staging and production deploys are added in PH-02 and PH-08.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/development/check-tracks.mjs --base origin/${{ github.base_ref }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: node scripts/docs/add-license.mjs --check
      - run: node scripts/docs/update-index.mjs --check
      - run: pnpm install --frozen-lockfile
      # Switch to --frozen once uv.lock is committed.
      - run: uv sync --all-packages
      - uses: nrwl/nx-set-shas@v4
      - name: Detect Terraform changes
        id: terraform-changes
        run: |
          files=$(git diff --name-only "$NX_BASE" "$NX_HEAD" -- infra/terraform)
          if [[ -n "$files" ]]; then echo "check=true" >> "$GITHUB_OUTPUT"; fi
      - uses: hashicorp/setup-terraform@v3
        if: steps.terraform-changes.outputs.check == 'true'
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Validate Terraform configuration
        if: steps.terraform-changes.outputs.check == 'true'
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive -diff
          for dir in modules/* envs/staging envs/production; do
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
          done
      - run: pnpm nx affected -t lint typecheck test build
