<html lang="__UI_LANG__">
<head>
<meta charset="utf-8">
<title>Trang chủ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.ui-page { min-height: 100vh; display: flex; flex-direction: column; }
.ui-main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: var(--ui-space-4); display: flex; flex-direction: column; gap: var(--ui-space-3); }
.ui-main h1 { margin: 0; font-size: var(--ui-title); }
.ui-card { background: var(--ui-surface); border: 1px solid var(--ui-line); border-radius: var(--ui-radius); }
.ui-list { list-style: none; margin: 0; padding: 0; }
.ui-list li { display: flex; justify-content: space-between; gap: var(--ui-space-2); padding: var(--ui-space-3); border-top: 1px solid var(--ui-line); }
.ui-list li:first-child { border-top: 0; }
.ui-list small { color: var(--ui-muted); font-variant-numeric: tabular-nums; }
.ui-note { padding: var(--ui-space-3); color: var(--ui-muted); }
</style>
</helmet>
<div class="ui-page">
  <dc-import name="TopBar" active="home" hint-size="100%,56px"></dc-import>
  <main class="ui-main">
    <h1>{{heading}}</h1>
    <section class="ui-card" aria-labelledby="recent">
      <h2 id="recent" class="ui-note" style="margin: 0; color: var(--ui-ink); font-size: 16px">Gần đây</h2>
      <sc-if value="{{isLoading}}"><p class="ui-note" role="status">Đang tải danh sách…</p></sc-if>
      <sc-if value="{{isEmpty}}"><p class="ui-note">Chưa có mục nào. [Hành động tiếp theo]</p></sc-if>
      <sc-if value="{{hasItems}}">
        <ul class="ui-list">
          <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
            <li><a href="{{it.href}}">{{it.name}}</a><small>{{it.time}}</small></li>
          </sc-for>
        </ul>
      </sc-if>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["normal","empty","loading"],"default":"normal"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'normal';
    // Sample data only; keep names, codes and counts consistent with every other screen.
    const items = s === 'normal' ? [
      { name: '[Mục mẫu A]', time: '09:41', href: 'Home.dc.html' },
      { name: '[Mục mẫu B]', time: '08:15', href: 'Home.dc.html' },
      { name: '[Mục mẫu C]', time: 'Hôm qua', href: 'Home.dc.html' }
    ] : [];
    return { heading: 'Trang chủ', isLoading: s === 'loading', isEmpty: s === 'empty', hasItems: items.length > 0, items };
  }
}
</script>
</body>
</html>
