<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI design</title>
<!-- Generated by tools/render.mjs from tools/index.template.html. Edit the template, then re-run. -->
<style>
/* Chrome của trình xem, không phải phong cách sản phẩm. Đổi các biến này nếu muốn index hợp với dự án. */
:root{--v-ground:#f4f4f5;--v-surface:#fff;--v-line:#d4d4d8;--v-ink:#18181b;--v-muted:#52525b;--v-selected:#e4e4e7;--v-stage:#e4e4e7;--v-accent:#1d4ed8;--v-focus:#2563eb}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--v-ground);color:var(--v-ink);font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
a{color:var(--v-accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--v-focus);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:10px 20px;background:var(--v-surface);border-bottom:1px solid var(--v-line)}
header h1{margin:0;font-size:16px;font-weight:600}
header nav{display:flex;gap:16px;font-size:14px}
.shell{flex:1;min-height:0;display:flex;flex-wrap:wrap}
aside{flex:1 1 260px;max-width:300px;min-height:0;overflow:auto;background:var(--v-surface);border-right:1px solid var(--v-line);padding:16px 12px}
aside label{display:block;font-size:12px;font-weight:600;color:var(--v-muted);margin:0 4px 6px}
aside input{width:100%;height:36px;padding:0 12px;border:1px solid var(--v-line);border-radius:4px;background:var(--v-surface)}
aside h2{margin:20px 4px 6px;font-size:12px;font-weight:600;color:var(--v-muted)}
aside ul{list-style:none;margin:0;padding:0}
aside a{display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:34px;padding:4px 10px;border-radius:4px;color:var(--v-ink);text-decoration:none;font-size:13px}
aside a:hover{background:var(--v-ground)}
aside a[aria-current="true"]{background:var(--v-selected);font-weight:600}
aside a small{color:var(--v-muted);font-variant-numeric:tabular-nums;font-weight:400}
main{flex:999 1 560px;min-width:0;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 20px;border-bottom:1px solid var(--v-line);background:var(--v-surface)}
.bar h2{margin:0;font-size:18px;font-weight:600}
.bar p{margin:2px 0 0;font-size:12px;color:var(--v-muted)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.controls select{height:34px;padding:0 10px;border:1px solid var(--v-line);border-radius:4px;background:var(--v-surface);max-width:260px}
.seg{display:flex;border:1px solid var(--v-line);border-radius:4px;overflow:hidden}
.seg button{height:32px;padding:0 12px;border:0;background:var(--v-surface);cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--v-ink);color:var(--v-surface);font-weight:600}
.seg button:disabled{cursor:default;color:var(--v-muted)}
.open{display:inline-flex;align-items:center;height:34px;padding:0 12px;border:1px solid var(--v-line);border-radius:4px;background:var(--v-surface);text-decoration:none;color:var(--v-ink);font-size:13px}
.stage{flex:1;min-height:0;overflow:auto;background:var(--v-stage);padding:20px}
.frame{background:var(--v-surface);border:1px solid var(--v-line);overflow:hidden;margin:0 auto;transform-origin:top left}
.frame iframe{display:block;border:0;background:var(--v-surface)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){aside{max-width:none;max-height:40vh;border-right:0;border-bottom:1px solid var(--v-line)}}
</style>
</head>
<body>
<header>
  <h1 id="app-title">UI design</h1>
  <nav aria-label="Tài liệu"><a href="design.md">design.md</a><a href="README.md">README</a></nav>
</header>
<div class="shell">
  <aside aria-label="Màn hình và component">
    <label for="q">Tìm màn hình</label>
    <input id="q" type="search" placeholder="Tên hoặc mã màn">
    <div id="list"></div>
  </aside>
  <main>
    <div class="bar">
      <div><h2 id="title">—</h2><p id="meta"></p></div>
      <div class="controls">
        <label class="sr" for="variant">Biến thể</label>
        <select id="variant"></select>
        <div class="seg" role="group" aria-label="Khổ màn hình">
          <button type="button" data-w="1440">Desktop</button>
          <button type="button" data-w="1024">Tablet</button>
          <button type="button" data-w="390">Điện thoại</button>
        </div>
        <a class="open" id="open" target="_blank" rel="noopener">Mở riêng</a>
      </div>
    </div>
    <div class="stage" id="stage"><div class="frame" id="frame"><iframe id="view" title="Xem trước"></iframe></div></div>
  </main>
</div>
<script>
const groups = /*__MANIFEST__*/null;
const config = /*__CONFIG__*/null;
const items = groups.flatMap(g => g.items);
const $ = id => document.getElementById(id);
const html = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let current = null, width = null;
document.title = config.title; $('app-title').textContent = config.title;

function renderList(filter) {
  const q = (filter || '').toLowerCase();
  $('list').innerHTML = groups.map(g => {
    const rows = g.items.filter(it => !q || (it.title + ' ' + it.name).toLowerCase().includes(q));
    if (!rows.length) return '';
    return '<h2>' + html(g.name) + '</h2><ul>' + rows.map(it =>
      '<li><a href="#' + it.name + '" aria-current="' + (current && current.name === it.name) + '">' +
      '<span>' + html(it.title) + '</span>' + (it.variants.length > 1 ? '<small>' + it.variants.length + '</small>' : '') + '</a></li>'
    ).join('') + '</ul>';
  }).join('');
}

function fit() {
  if (!current) return;
  const w = width || current.width, h = current.fill ? Math.max(current.height, 900) : current.height;
  const avail = $('stage').clientWidth - 40;
  const s = Math.min(1, avail / w);
  const v = $('view');
  v.style.width = w + 'px'; v.style.height = h + 'px';
  $('frame').style.width = w + 'px'; $('frame').style.height = h + 'px';
  $('frame').style.transform = 'scale(' + s + ')';
  $('frame').style.marginBottom = (h * s - h) + 'px';
  $('frame').style.marginRight = (w * s - w) + 'px';
}

function show() {
  const [name, key] = decodeURIComponent(location.hash.slice(1)).split('|');
  current = items.find(it => it.name === name) || items.find(it => it.name === config.defaultScreen) || items[0];
  if (!current) { $('title').textContent = 'Chưa có màn nào trong source/'; return; }
  const variant = current.variants.find(v => v.file.endsWith('--' + key + '.html')) || current.variants[0];
  $('title').textContent = current.title;
  $('meta').textContent = 'source/' + current.name + '.dc.html · ' + current.width + ' × ' + current.height;
  $('variant').innerHTML = current.variants.map(v => '<option value="' + v.file + '"' + (v === variant ? ' selected' : '') + '>' + html(v.label) + '</option>').join('');
  $('variant').disabled = current.variants.length < 2;
  $('view').src = variant.file; $('open').href = variant.file;
  width = current.fill ? width : null;
  document.querySelectorAll('.seg button').forEach(b => { b.disabled = !current.fill; b.setAttribute('aria-pressed', String(current.fill && +b.dataset.w === (width || 1440))); });
  renderList($('q').value); fit();
}

$('variant').onchange = e => {
  const file = e.target.value, m = file.match(/--(.+)\.html$/);
  history.replaceState(null, '', '#' + current.name + (m ? '|' + m[1] : ''));
  $('view').src = file; $('open').href = file;
};
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { width = +b.dataset.w; show(); });
$('q').oninput = e => renderList(e.target.value);
addEventListener('hashchange', show);
addEventListener('resize', fit);
show();
</script>
</body>
</html>
