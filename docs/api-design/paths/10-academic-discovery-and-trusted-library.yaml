# PRD 10 Academic Discovery and Trusted Library · 17.2 Google Scholar · 17.3 tài liệu — WF-04 — milestone M4.
# Chỉ Reference Trusted được chọn vào project, index và dùng làm citation (GOAL-03).

/discovery/sources:
  get:
    tags: [Discovery]
    operationId: listDiscoverySources
    summary: Nguồn discovery khả dụng và năng lực
    description: Google Scholar qua dịch vụ trung gian theo hợp đồng là nguồn chính; OpenAlex/Semantic Scholar dự phòng (DEC-19).
    x-requirements: [DISC-SCHOLAR-002, DISC-ADAPTER-001, INT-SCHOLAR-001]
    x-priority: P0
    x-milestone: M4
    responses:
      '200':
        description: Danh sách nguồn.
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/library.yaml#/DiscoverySource }

/discovery/searches:
  post:
    tags: [Discovery]
    operationId: startDiscoverySearch
    summary: Tìm tài liệu (workflow discovery)
    description: |
      Discovery Agent truy vấn nguồn; kết quả lưu thành Discovered Result ở trạng thái New. Discovered Result không bao giờ
      là nguồn evidence. Nguồn không khả dụng: workflow Failed với gợi ý nhập thủ công (INT-SCHOLAR-006).
    x-requirements: [DISC-SCHOLAR-001, INT-SCHOLAR-002, DATA-IDEMP-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/library.yaml#/DiscoverySearchRequest }
    responses:
      '202': { $ref: ../components/responses.yaml#/WorkflowAccepted }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/discovery/author-searches:
  post:
    tags: [Discovery]
    operationId: startAuthorSearch
    summary: Tìm công bố theo tác giả
    description: Kết quả có thể không đầy đủ (`completeness = partial`, 17.6).
    x-requirements: [DISC-AUTHOR-001]
    x-priority: P1
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/library.yaml#/AuthorSearchRequest }
    responses:
      '202': { $ref: ../components/responses.yaml#/WorkflowAccepted }
      '503': { $ref: ../components/responses.yaml#/ServiceUnavailable }

/discovered-results:
  get:
    tags: [Discovery]
    operationId: listDiscoveredResults
    summary: Kết quả tìm kiếm để review
    x-requirements: [DISC-REVIEW-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - name: workflowId
        in: query
        description: Lọc theo lần tìm kiếm.
        schema: { $ref: ../components/schemas/common.yaml#/Id }
      - name: status
        in: query
        schema: { $ref: ../components/schemas/library.yaml#/DiscoveredResultStatus }
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Cursor
    responses:
      '200':
        description: Trang kết quả.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common.yaml#/Page
                - properties:
                    items:
                      type: array
                      items: { $ref: ../components/schemas/library.yaml#/DiscoveredResult }

/discovered-results/{discoveredResultId}:
  parameters:
    - name: discoveredResultId
      in: path
      required: true
      schema: { $ref: ../components/schemas/common.yaml#/Id }
  patch:
    tags: [Discovery]
    operationId: setDiscoveredResultStatus
    summary: Chọn, bỏ chọn hoặc loại một kết quả
    x-requirements: [DISC-REVIEW-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [New, Selected, Rejected] }
    responses:
      '200':
        description: Đã cập nhật.
        content:
          application/json:
            schema: { $ref: ../components/schemas/library.yaml#/DiscoveredResult }
      '409': { $ref: ../components/responses.yaml#/Conflict }

/discovered-results/import:
  post:
    tags: [Trusted Library]
    operationId: importDiscoveredResults
    summary: Nhập kết quả đã chọn thành Reference chờ duyệt (từng cái hoặc theo lô)
    description: |
      Tạo Reference ở Pending Approval (Reference Processing Agent chuẩn hóa metadata) và pending action
      `reference_approval`. Kết quả trùng với reference đã có được đánh dấu cảnh báo, không tạo bản sao.
    x-requirements: [LIB-IMPORT-001, LIB-METADATA-001, DATA-IDEMP-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [discoveredResultIds]
            properties:
              discoveredResultIds:
                type: array
                minItems: 1
                maxItems: 200
                items: { $ref: ../components/schemas/common.yaml#/Id }
    responses:
      '202': { $ref: ../components/responses.yaml#/WorkflowAccepted }
      '400': { $ref: ../components/responses.yaml#/BadRequest }

/references:
  get:
    tags: [Trusted Library]
    operationId: listReferences
    summary: Trusted Library và reference chờ duyệt
    x-requirements: [LIB-LIBRARY-001, UX-REF-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - name: approvalStatus
        in: query
        style: form
        explode: false
        schema:
          type: array
          items: { $ref: ../components/schemas/library.yaml#/ReferenceApprovalStatus }
      - name: indexingStatus
        in: query
        schema: { $ref: ../components/schemas/library.yaml#/IndexingStatus }
      - name: q
        in: query
        description: Tìm theo tiêu đề, tác giả, DOI, BibTeX key.
        schema: { type: string }
      - { name: year, in: query, schema: { type: integer } }
      - name: notSelectedInProject
        in: query
        description: Chỉ reference chưa được chọn vào project này (khi chọn reference cho project).
        schema: { $ref: ../components/schemas/common.yaml#/Id }
      - $ref: ../components/parameters.yaml#/Limit
      - $ref: ../components/parameters.yaml#/Cursor
    responses:
      '200':
        description: Trang reference.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common.yaml#/Page
                - properties:
                    items:
                      type: array
                      items: { $ref: ../components/schemas/library.yaml#/Reference }
  post:
    tags: [Trusted Library]
    operationId: createReferenceManually
    summary: Nhập reference thủ công theo DOI hoặc BibTeX
    description: Reference tạo ra ở Pending Approval; không bỏ qua bước duyệt (LIB-IMPORT-002).
    x-requirements: [LIB-IMPORT-002, LIB-METADATA-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/library.yaml#/ReferenceManualCreate }
    responses:
      '201':
        description: Reference đã tạo (một hoặc nhiều với BibTeX nhiều entry).
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/library.yaml#/Reference }
                errors:
                  type: array
                  description: Entry BibTeX không phân tích được.
                  items: { $ref: ../components/schemas/common.yaml#/Problem }
      '400': { $ref: ../components/responses.yaml#/BadRequest }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }

/references/pdf-imports:
  post:
    tags: [Trusted Library]
    operationId: importReferenceFromPdf
    summary: Nhập reference từ file PDF
    description: |
      Chỉ PDF có lớp văn bản, ≤ 50 MB, không OCR (OQ-050). Metadata được trích và chuẩn hóa; Reference ở Pending
      Approval; file thành Source Document, index sau khi Trusted.
    x-requirements: [LIB-IMPORT-002, LIB-CONTENT-001, INT-DOC-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                contentMediaType: application/pdf
          encoding:
            file:
              contentType: application/pdf
    responses:
      '202': { $ref: ../components/responses.yaml#/WorkflowAccepted }
      '413': { $ref: ../components/responses.yaml#/PayloadTooLarge }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }

/references/approvals:
  post:
    tags: [Trusted Library]
    operationId: decideReferences
    summary: Duyệt hoặc từ chối reference theo lô (APR-04)
    description: |
      Mỗi reference ghi ApprovalRecord riêng. Reference có cảnh báo trùng không được duyệt chung lô mà phải có quyết định
      riêng (`skipped` nếu gửi kèm lô khác). Không có mức tin cậy tự động theo nguồn (OQ-090).
      Reference Trusted có Source Document được đưa vào hàng đợi indexing.
    x-requirements: [LIB-APPROVAL-001, DATA-IDEMP-001]
    x-apr: APR-04
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/library.yaml#/ReferenceApprovalBatch }
    responses:
      '200':
        description: Kết quả từng reference.
        content:
          application/json:
            schema: { $ref: ../components/schemas/library.yaml#/ReferenceApprovalResult }
      '400': { $ref: ../components/responses.yaml#/BadRequest }

/references/{referenceId}:
  parameters:
    - $ref: ../components/parameters.yaml#/ReferenceId
  get:
    tags: [Trusted Library]
    operationId: getReference
    summary: Chi tiết reference
    x-requirements: [LIB-LIBRARY-001]
    x-priority: P0
    x-milestone: M4
    responses:
      '200':
        description: Reference.
        headers:
          ETag: { schema: { type: string } }
        content:
          application/json:
            schema: { $ref: ../components/schemas/library.yaml#/Reference }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  patch:
    tags: [Trusted Library]
    operationId: updateReferenceMetadata
    summary: Sửa metadata (tạo metadataVersion mới)
    description: BibliographyEntry đang dùng version cũ được đề xuất cập nhật; Revoked/Rejected chỉ đọc.
    x-requirements: [LIB-METADATA-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/IfMatch
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        application/merge-patch+json:
          schema: { $ref: ../components/schemas/library.yaml#/ReferenceUpdate }
    responses:
      '200':
        description: Đã cập nhật.
        content:
          application/json:
            schema: { $ref: ../components/schemas/library.yaml#/Reference }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '412': { $ref: ../components/responses.yaml#/PreconditionFailed }
  delete:
    tags: [Trusted Library]
    operationId: deleteReference
    summary: Xóa reference (APR-08)
    description: Chỉ khi không project nào dùng; nếu đang dùng trả `409` — dùng thu hồi thay thế.
    x-requirements: [LIB-LIFECYCLE-001]
    x-apr: APR-08
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/CsrfToken
    responses:
      '204': { $ref: ../components/responses.yaml#/NoContent }
      '409': { $ref: ../components/responses.yaml#/Conflict }

/references/{referenceId}/revoke:
  parameters:
    - $ref: ../components/parameters.yaml#/ReferenceId
  post:
    tags: [Trusted Library]
    operationId: revokeReference
    summary: Thu hồi Trusted Reference (APR-04)
    description: |
      Trusted → Revoked. Evidence chuyển Stale; selection Removed; claim, citation và Task phụ thuộc nhận cờ needsReview;
      citation tới reference này không qua kiểm tra cho đến khi được thay (LIB-LIFECYCLE-001). Phản hồi kèm báo cáo ảnh hưởng.
    x-requirements: [LIB-LIFECYCLE-001, DATA-AUDIT-001]
    x-apr: APR-04
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, minLength: 1 }
    responses:
      '200':
        description: Reference Revoked.
        content:
          application/json:
            schema:
              type: object
              properties:
                reference: { $ref: ../components/schemas/library.yaml#/Reference }
                impact: { $ref: ../components/schemas/plan.yaml#/ImpactReport }
      '409': { $ref: ../components/responses.yaml#/Conflict }

/references/{referenceId}/reinstate:
  parameters:
    - $ref: ../components/parameters.yaml#/ReferenceId
  post:
    tags: [Trusted Library]
    operationId: reinstateReference
    summary: Duyệt lại reference Revoked hoặc Rejected (APR-04)
    x-requirements: [LIB-LIFECYCLE-001]
    x-apr: APR-04
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              reason: { type: string }
    responses:
      '200':
        description: Reference Trusted.
        content:
          application/json:
            schema: { $ref: ../components/schemas/library.yaml#/Reference }
      '409': { $ref: ../components/responses.yaml#/Conflict }

/references/{referenceId}/merge:
  parameters:
    - $ref: ../components/parameters.yaml#/ReferenceId
  post:
    tags: [Trusted Library]
    operationId: mergeReference
    summary: Gộp reference trùng vào reference khác
    description: Reference này nhận `mergedIntoId`; selection, evidence và bibliography chuyển sang reference đích.
    x-requirements: [LIB-METADATA-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [intoReferenceId]
            properties:
              intoReferenceId: { $ref: ../components/schemas/common.yaml#/Id }
    responses:
      '200':
        description: Reference đích sau khi gộp.
        content:
          application/json:
            schema: { $ref: ../components/schemas/library.yaml#/Reference }
      '409': { $ref: ../components/responses.yaml#/Conflict }

/references/{referenceId}/usage:
  parameters:
    - $ref: ../components/parameters.yaml#/ReferenceId
  get:
    tags: [Trusted Library]
    operationId: getReferenceUsage
    summary: Reference đang được dùng ở project nào
    x-requirements: [LIB-LIBRARY-001, LIB-LIFECYCLE-001]
    x-priority: P0
    x-milestone: M4
    responses:
      '200':
        description: Quan hệ ngược được tính toán (OWN-02).
        content:
          application/json:
            schema: { $ref: ../components/schemas/library.yaml#/ReferenceUsage }

/references/{referenceId}/document:
  parameters:
    - $ref: ../components/parameters.yaml#/ReferenceId
  get:
    tags: [Trusted Library]
    operationId: getReferenceDocument
    summary: Tải file Source Document
    x-requirements: [LIB-CONTENT-001, EVID-INSPECTOR-001]
    x-priority: P0
    x-milestone: M4
    responses:
      '200':
        description: File PDF.
        content:
          application/pdf:
            schema: { type: string, contentMediaType: application/pdf }
      '404': { $ref: ../components/responses.yaml#/NotFound }
  put:
    tags: [Trusted Library]
    operationId: uploadReferenceDocument
    summary: Cung cấp hoặc thay file PDF cho reference
    description: |
      Unavailable/Indexed → Queued (18.2). Index theo khóa (referenceId, contentHash, embeddingModel) — tải lại cùng file
      không index lại (DATA-IDEMP-005).
    x-requirements: [LIB-CONTENT-001, EVID-INDEX-001, INT-DOC-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                contentMediaType: application/pdf
    responses:
      '200':
        description: Reference với trạng thái indexing mới.
        content:
          application/json:
            schema: { $ref: ../components/schemas/library.yaml#/Reference }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '413': { $ref: ../components/responses.yaml#/PayloadTooLarge }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }

/references/{referenceId}/indexing/retry:
  parameters:
    - $ref: ../components/parameters.yaml#/ReferenceId
  post:
    tags: [Trusted Library]
    operationId: retryReferenceIndexing
    summary: Thử lại indexing (Failed → Queued)
    x-requirements: [EVID-INDEX-002]
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/CsrfToken
    responses:
      '202': { $ref: ../components/responses.yaml#/WorkflowAccepted }
      '409': { $ref: ../components/responses.yaml#/Conflict }

/projects/{projectId}/references:
  parameters:
    - $ref: ../components/parameters.yaml#/ProjectId
  get:
    tags: [Trusted Library]
    operationId: listProjectReferences
    summary: Reference được chọn cho project
    x-requirements: [LIB-PROJECT-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - name: status
        in: query
        schema: { type: string, enum: [Active, Removed], default: Active }
    responses:
      '200':
        description: Danh sách selection.
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/library.yaml#/ProjectReferenceSelection }
  post:
    tags: [Trusted Library]
    operationId: selectReferencesForProject
    summary: Chọn Trusted Reference vào project
    description: Reference không ở Trusted trả `422 reference_not_trusted`. Không sao chép reference — dùng lại cấp tài khoản.
    x-requirements: [LIB-PROJECT-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/CsrfToken
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [referenceIds]
            properties:
              referenceIds:
                type: array
                minItems: 1
                items: { $ref: ../components/schemas/common.yaml#/Id }
              reason: { type: string }
    responses:
      '200':
        description: Selection Active.
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: ../components/schemas/library.yaml#/ProjectReferenceSelection }
      '409': { $ref: ../components/responses.yaml#/Conflict }
      '422': { $ref: ../components/responses.yaml#/UnprocessableEntity }

/projects/{projectId}/references/{referenceId}:
  parameters:
    - $ref: ../components/parameters.yaml#/ProjectId
    - $ref: ../components/parameters.yaml#/ReferenceId
  delete:
    tags: [Trusted Library]
    operationId: removeReferenceFromProject
    summary: Bỏ chọn reference khỏi project (Active → Removed)
    description: Reference vẫn Trusted trong thư viện. Task cần reference này bị chặn bởi RC-05 khi tính lại readiness.
    x-requirements: [LIB-PROJECT-001]
    x-priority: P0
    x-milestone: M4
    parameters:
      - $ref: ../components/parameters.yaml#/CsrfToken
    responses:
      '204': { $ref: ../components/responses.yaml#/NoContent }
      '409': { $ref: ../components/responses.yaml#/Conflict }
