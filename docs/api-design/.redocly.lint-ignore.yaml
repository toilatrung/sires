# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
paths/15-settings-and-sign-in.yaml:
  operation-2xx-response:
    - '#/~1auth~1login/get/responses'
    - '#/~1auth~1callback/get/responses'
# etroyOidc mô tả luồng authorization code giữa backend SIRes (Relying Party) và eTroy OIDC; client không gửi token
# eTroy tới API nên không operation nào yêu cầu scheme này (mọi operation dùng sessionCookie). Giữ để tài liệu hóa
# tích hợp (INT-OIDC-001); bỏ qua cảnh báo no-unused-components của Redocly bản mới.
openapi.yaml:
  no-unused-components:
    - '#/components/securitySchemes/etroyOidc'
