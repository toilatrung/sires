      - $ref: '#/channels/events/messages/providerConnectionIssueReported'
      - $ref: '#/channels/events/messages/projectLifecycleChanged'
      - $ref: '#/channels/events/messages/messagePosted'
      - $ref: '#/channels/events/messages/pendingActionChanged'
      - $ref: '#/channels/events/messages/notificationCreated'
      - $ref: '#/channels/events/messages/planVersionStatusChanged'
      - $ref: '#/channels/events/messages/taskStatusChanged'
      - $ref: '#/channels/events/messages/workflowStatusChanged'
      - $ref: '#/channels/events/messages/agentRunStatusChanged'
      - $ref: '#/channels/events/messages/promptStatusChanged'
      - $ref: '#/channels/events/messages/referenceStatusChanged'
      - $ref: '#/channels/events/messages/referenceIndexingStatusChanged'
      - $ref: '#/channels/events/messages/projectReferenceChanged'
      - $ref: '#/channels/events/messages/researchObjectStatusChanged'
      - $ref: '#/channels/events/messages/manuscriptObjectStatusChanged'
      - $ref: '#/channels/events/messages/deliberationStarted'
      - $ref: '#/channels/events/messages/deliberationRoundClosed'
      - $ref: '#/channels/events/messages/deliberationEntryRetracted'
      - $ref: '#/channels/events/messages/deliberationStatusChanged'
      - $ref: '#/channels/events/messages/contextSnapshotOutdated'
      - $ref: '#/channels/events/messages/accountDeletionRequested'
  gatewayConsumesChat:
    action: receive
    channel: { $ref: '#/channels/chatStream' }
