  sandboxRunnerReplies:
    action: send
    channel: { $ref: '#/channels/sandboxReply' }
    title: sandbox-runner trả kết quả Mermaid
  agentCoreStreamsChat:
    action: send
    channel: { $ref: '#/channels/chatStream' }
    title: agent-core phát delta chat

