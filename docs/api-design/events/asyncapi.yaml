    channel: { $ref: '#/channels/events' }
    title: audit lưu Audit Event chỉ ghi thêm (ADR-23); xóa theo vòng đời
    messages:
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/accountDeletionRequested'
      - $ref: '#/channels/events/messages/projectPurgeDue'
  agentCoreConsumes:
    action: receive
    channel: { $ref: '#/channels/events' }
    title: agent-core báo Agent Run đang chạy cùng workflow có entry mới trên board (queue agent-core.events — Assumption)
    messages:
      - $ref: '#/channels/events/messages/deliberationEntryAdded'
      - $ref: '#/channels/events/messages/deliberationEntryFinalized'
      - $ref: '#/channels/events/messages/deliberationEntryRetracted'
  agentCoreReceivesAgentRun:
    action: receive
    channel: { $ref: '#/channels/agentRun' }
    title: agent-core thực thi Agent Run (bắt tay start trước khi gọi provider)
  knowledgeReceivesIndex:
    action: receive
    channel: { $ref: '#/channels/knowledgeIndex' }
    title: knowledge chạy pipeline indexing
  sandboxRunnerReceivesJob:
    action: receive
    channel: { $ref: '#/channels/sandboxBuild' }
    title: sandbox-runner chạy job trong sandbox
  researchReceivesSandboxReply:
    action: receive
    channel: { $ref: '#/channels/sandboxReply' }
    title: research nhận kết quả Mermaid

components:
  securitySchemes:
    serviceCredentials:
      type: userPassword
      description: |
        Mỗi service một tài khoản RabbitMQ riêng, xác thực SASL qua TLS (amqps), quyền configure/write/read giới hạn đúng
        exchange và queue trong `operations` của service đó; bí mật lấy từ kho bí mật, không ghi log. Áp dụng cho mọi
        operation qua `servers.rabbitmq.security`. Assumption của biên soạn — architecture chưa chốt cơ chế xác thực broker.
  messageTraits:
    envelopeHeaders:
      headers:
        type: object
        properties:
          traceparent: { type: string, description: W3C trace context (NFR-OBS-004). }
          message_id: { type: string, description: Bằng `id` của vỏ sự kiện. }
  operationTraits:
    persistentSend:
      description: |
        Gửi bền (deliveryMode 2 = persistent) tới exchange/queue bền; relay outbox chờ publisher confirm. Theo AMQP
        binding 0.3.0, `deliveryMode` thuộc operation binding, không thuộc message binding.
      bindings:
        amqp:
          deliveryMode: 2
          bindingVersion: 0.3.0

  schemas:
    Envelope:
      $ref: ../internal/schemas.yaml#/EventEnvelope
    StateChange:
      $ref: ../internal/schemas.yaml#/StateChange
    Id:
      $ref: ../components/schemas/common.yaml#/Id

  messages:
    # ---------- identity ----------
    accountCreated:
      name: account.created
      title: Tài khoản SIRes được tạo lần đầu từ eTroy OIDC
      x-producer: identity
      x-consumers: [audit]
      x-requirements: [INT-OIDC-002]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: account.created }
              data:
                type: object
                required: [issuer]
