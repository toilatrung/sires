          - type: object
            properties:
              type: { const: workflow.status_changed }
              data:
                allOf:
                  - $ref: '#/components/schemas/StateChange'
                  - type: object
                    properties:
                      workflowType: { type: string }
                      taskId: { $ref: '#/components/schemas/Id' }
                      firstRun: { type: boolean, description: true ở lần đầu chuyển Running. }
                      lastError:
                        type: object
                        properties:
