      - $ref: '#/channels/events/messages/taskActivated'
      - $ref: '#/channels/events/messages/taskActivationCancelled'
      - $ref: '#/channels/events/messages/referenceStatusChanged'
      - $ref: '#/channels/events/messages/referenceMetadataUpdated'
      - $ref: '#/channels/events/messages/projectReferenceChanged'
      - $ref: '#/channels/events/messages/researchContextVersioned'
