      name: workflow.status_changed
      title: Workflow đổi trạng thái (Running, Waiting for User, Paused, Interrupted, Succeeded, Failed, Cancelled)
      description: |
        Routing key con `workflow.status_changed.<toState>` (chữ thường, gạch dưới) để consumer chỉ bind trạng thái cần.
        planning: Running lần đầu → Task In Progress (T-06); Succeeded → In Review; Failed → Failed.
        workspace: Interrupted → Pending Action Recovery decision (WF-06).
