  # ---- producer ----
  identityPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    traits: [{ $ref: '#/components/operationTraits/persistentSend' }]
    title: identity phát
    messages:
      - $ref: '#/channels/events/messages/accountCreated'
      - $ref: '#/channels/events/messages/accountDeletionRequested'
      - $ref: '#/channels/events/messages/providerConnectionChanged'
      - $ref: '#/channels/events/messages/providerConnectionIssueReported'
      - $ref: '#/channels/events/messages/embeddingModelChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  workspacePublishes:
    action: send
    channel: { $ref: '#/channels/events' }
