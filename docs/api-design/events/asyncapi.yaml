        Draft loại `deliberation_record`) và `decisionPromptId`; Failed kèm prompt chạy lại / tiếp tục không thảo luận.
      x-producer: orchestration
      x-consumers: [gateway, workspace]
      x-requirements: [ORCH-DELIB-002, ORCH-DELIB-004, NFR-USAGE-005]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: deliberation.status_changed }
              data:
                allOf:
                  - $ref: '#/components/schemas/StateChange'
                  - type: object
                    required: [workflowId, deliberationId]
                    properties:
                      workflowId: { $ref: '#/components/schemas/Id' }
                      deliberationId: { $ref: '#/components/schemas/Id' }
                      recordArtifactId: { type: [string, 'null'], format: uuid }
                      recordArtifactVersionId: { type: [string, 'null'], format: uuid }
                      decisionPromptId: { type: [string, 'null'], format: uuid }
                      usageTotal: { $ref: ../components/schemas/orchestration.yaml#/UsageTotal }
    contextSnapshotOutdated:
      name: context_snapshot.outdated
      title: Context Snapshot của phiên lỗi thời — một entity trong snapshot có phiên bản mới (CTX-SNAPSHOT-001)
      description: |
        orchestration phát khi nhận sự kiện thay đổi của entity nằm trong snapshot (`research_context.versioned`,
        `plan_version.status_changed`, `task.status_changed`, `research.object_status_changed`, `reference.status_changed`,
        `reference.metadata_updated`, `project_reference.changed`) hoặc khi Context Item của chính nó đổi. Phiên vẫn chạy trên snapshot cũ. Chỉ phát một lần cho lần chuyển
        false → true; entity đổi thêm sau đó cập nhật `changedEntities` (lấy qua API), không phát lại (Assumption).
      x-producer: orchestration
      x-consumers: [gateway]
      x-requirements: [CTX-SNAPSHOT-001, ORCH-DELIB-004, UX-MONITOR-006]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: context_snapshot.outdated }
              data:
                type: object
                required: [workflowId, deliberationId, contextSnapshotId, changedEntities]
                properties:
                  workflowId: { $ref: '#/components/schemas/Id' }
                  deliberationId: { $ref: '#/components/schemas/Id' }
                  contextSnapshotId: { $ref: '#/components/schemas/Id' }
                  changedEntities:
                    type: array
                    items: { $ref: ../components/schemas/orchestration.yaml#/ChangedEntity }

    # ---------- library ----------
    referenceStatusChanged:
      name: reference.status_changed
      title: Reference Pending Approval, Trusted (APR-04), Rejected, Revoked, khôi phục
      description: |
        knowledge: Trusted → xếp `knowledge.index`; Revoked → loại khỏi phạm vi truy xuất ngay (INT-VECTOR-002).
        research: Revoked → Evidence Stale, claim needs review. manuscript, planning: cập nhật bản sao, needs review (OQ-018).
      x-producer: library
      x-consumers: [knowledge, research, manuscript, planning, orchestration, workspace, gateway]
      x-requirements: [LIB-APPROVAL-001, LIB-LIFECYCLE-001]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: reference.status_changed }
              data:
                allOf:
                  - $ref: '#/components/schemas/StateChange'
                  - type: object
                    properties:
                      bibtexKey: { type: string }
                      hasContent: { type: boolean }
                      reason: { type: string }
    referenceMetadataUpdated:
      name: reference.metadata_updated
      title: Researcher sửa metadata (phiên bản mới — DEC-21) — manuscript sinh lại Bibliography Entry
      description: |
        orchestration: reference có trong Context Snapshot của phiên đang Running với `metadataVersion` cũ hơn thì đánh dấu
        snapshot lỗi thời (CTX-SNAPSHOT-001).
      x-producer: library
      x-consumers: [manuscript, orchestration]
      x-requirements: [LIB-METADATA-001, MS-BIB-001, CTX-SNAPSHOT-001]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: reference.metadata_updated }
              data:
                type: object
                required: [referenceId, metadataVersion]
                properties:
                  referenceId: { $ref: '#/components/schemas/Id' }
                  metadataVersion: { type: integer }
    referenceDeleted:
      name: reference.deleted
      title: Reference bị xóa (không project nào dùng — NFR-RET-003)
      x-producer: library
      x-consumers: [knowledge, research, manuscript]
      x-requirements: [NFR-RET-003, INT-VECTOR-002]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: reference.deleted }
              data:
                type: object
                required: [referenceId]
                properties:
                  referenceId: { $ref: '#/components/schemas/Id' }
    projectReferenceChanged:
      name: project_reference.changed
      title: Reference được chọn hoặc bỏ chọn cho project — knowledge cập nhật phạm vi truy xuất
      description: |
        orchestration: selection của project nằm trong Context Snapshot của phiên đang Running đổi thì đánh dấu snapshot
        lỗi thời (CTX-SNAPSHOT-001).
      x-producer: library
      x-consumers: [knowledge, research, gateway, orchestration]
      x-requirements: [LIB-PROJECT-001, INT-VECTOR-001, CTX-SNAPSHOT-001]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: project_reference.changed }
              data:
                type: object
                required: [referenceId, selectionStatus]
                properties:
                  referenceId: { $ref: '#/components/schemas/Id' }
                  selectionStatus: { type: string, enum: [Active, Removed] }

    # ---------- knowledge ----------
    referenceIndexingStatusChanged:
      name: reference.indexing_status_changed
      title: Indexing Queued, Indexing, Indexed, Failed, Unavailable, cần index lại
      x-producer: knowledge
      x-consumers: [library, gateway]
      x-requirements: [EVID-INDEX-001, INT-DOC-002]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: reference.indexing_status_changed }
              data:
                allOf:
                  - $ref: '#/components/schemas/StateChange'
                  - type: object
                    properties:
                      referenceId: { $ref: '#/components/schemas/Id' }
                      embeddingModel: { type: string }
                      errorCode: { type: string, enum: [no_text_layer, too_large, too_many_pages, corrupt, no_content, embedding_not_configured, provider_error] }

    # ---------- research ----------
    researchObjectStatusChanged:
      name: research.object_status_changed
      title: Evidence, Claim, Artifact Version đổi trạng thái (Accepted, Rejected, Stale, needs review)
      description: Routing key con `research.object_status_changed.<objectType>`.
      x-producer: research
      x-consumers: [planning, gateway, orchestration]
      x-requirements: [CLAIM-SUPPORT-001, SYN-HUMAN-REVIEW-001, LIB-LIFECYCLE-001]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: research.object_status_changed }
              data:
                allOf:
                  - $ref: '#/components/schemas/StateChange'
                  - type: object
                    properties:
                      taskId: { $ref: '#/components/schemas/Id' }
                      needsReview: { type: boolean }

    # ---------- manuscript ----------
    manuscriptObjectStatusChanged:
      name: manuscript.object_status_changed
      title: Change Proposal, Build, Revision đổi trạng thái
      description: Routing key con `manuscript.object_status_changed.<objectType>`.
      x-producer: manuscript
      x-consumers: [workspace, gateway]
      x-requirements: [MS-DIFF-001, MS-BUILD-001]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: manuscript.object_status_changed }
              data: { $ref: '#/components/schemas/StateChange' }

    # ---------- mọi service ----------
    auditRecorded:
      name: audit.recorded
      title: Audit Event tạo trong giao dịch của service nguồn (ADR-23)
      description: Không bao giờ chứa API key, nội dung tài liệu, toàn văn prompt (NFR-OBS-002).
      x-producer: "* (mọi service có entity)"
      x-consumers: [audit]
      x-requirements: [CTX-AUDIT-001, NFR-DUR-001, NFR-RET-008]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: audit.recorded }
              data: { $ref: ../components/schemas/orchestration.yaml#/AuditEvent }
    dataPurged:
      name: data.purged
      title: Service xác nhận đã xóa vĩnh viễn dữ liệu của project hoặc tài khoản
      x-producer: "* (mọi service có dữ liệu)"
      x-consumers: [workspace, identity]
      x-requirements: [NFR-RET-002, NFR-RET-004]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: data.purged }
              data:
                type: object
                required: [scope, service]
                properties:
                  scope: { type: string, enum: [project, account] }
                  service: { type: string }
                  objectStorageCleared: { type: boolean }

    # ---------- lệnh ----------
    agentRunRequested:
      name: agent.run
      title: Chạy một Agent Run
      x-producer: orchestration
      x-consumers: [agent-core]
      x-requirements: [CTX-ROUTING-001, CTX-RECOVERY-001]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload: { $ref: ../internal/schemas.yaml#/AgentRunAssignment }
    indexRequested:
      name: knowledge.index
      title: Index (hoặc index lại) tài liệu của một reference
      x-producer: knowledge
      x-consumers: [knowledge]
      x-requirements: [EVID-INDEX-001, INT-DOC-003, INT-VECTOR-003]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        type: object
        required: [accountId, referenceId, reason]
        properties:
          accountId: { $ref: '#/components/schemas/Id' }
          referenceId: { $ref: '#/components/schemas/Id' }
          reason: { type: string, enum: [trusted, content_uploaded, embedding_model_changed, extractor_upgrade, retry] }
          attempt: { type: integer, minimum: 1, maximum: 3 }
    sandboxJobRequested:
      name: sandbox.build
      title: Build LaTeX, kiểm tra hoặc render Mermaid trong sandbox
      x-producer: "manuscript, research"
      x-consumers: [sandbox-runner]
      x-requirements: [MS-BUILD-001, NFR-SANDBOX-001, INT-LATEX-002, INT-DIAGRAM-002]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload: { $ref: ../internal/schemas.yaml#/SandboxJob }
    sandboxJobCompleted:
      name: sandbox.reply
      title: Kết quả job Mermaid (RPC theo correlationId)
      x-producer: sandbox-runner
      x-consumers: [research]
      x-requirements: [INT-DIAGRAM-001, INT-DIAGRAM-004]
      correlationId:
        location: $message.header#/correlation_id
      payload: { $ref: ../internal/schemas.yaml#/SandboxResult }
    chatDelta:
      name: chat.delta
      title: Một đoạn câu trả lời đang stream của Orchestrator (NFR-PERF-005)
      x-producer: agent-core
      x-consumers: [gateway]
      x-requirements: [NFR-PERF-005, PROJ-CHAT-001]
      payload:
        type: object
        required: [accountId, conversationId, agentRunId, seq, text]
        properties:
          accountId: { $ref: '#/components/schemas/Id' }
          conversationId: { $ref: '#/components/schemas/Id' }
          agentRunId: { $ref: '#/components/schemas/Id' }
          seq: { type: integer }
          text: { type: string }
          final: { type: boolean }
