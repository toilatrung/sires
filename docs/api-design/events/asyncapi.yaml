asyncapi: 3.0.0
info:
  title: SIRes events and commands
  version: 0.1.0-mvp
  description: |
    Hợp đồng messaging giữa các service SIRes qua RabbitMQ (ADR-19, ADR-20).

    - **Sự kiện** trên topic exchange `sires.events`: routing key = `type` của sự kiện; với sự kiện đổi trạng thái
      (data là StateChange hoặc có `change`) thêm một đoạn con = trạng thái đích viết thường, khoảng trắng thành `_`,
      ví dụ `workflow.status_changed.waiting_for_user`, `reference.status_changed.trusted`,
      `project.lifecycle_changed.archived` — consumer bind `workflow.status_changed.*` hoặc đúng trạng thái cần. Mỗi sự kiện được ghi vào bảng
      outbox của service phát trong cùng giao dịch với thay đổi (architecture 6.4), relay publish với publisher confirm.
      Giao ít nhất một lần; consumer idempotent bằng bảng inbox theo `id`, bỏ qua bản có `aggregate.version` cũ hơn.
    - **Lệnh** trên queue riêng (`agent.run`, `knowledge.index`, `sandbox.build`): một consumer nhận, ack thủ công.
      Trạng thái thật nằm ở database của service gửi lệnh; lệnh lỗi thời bị từ chối ở bước bắt tay.
    - **Stream** trên exchange `sires.stream` (không bền): delta chat, mất thì bỏ qua.

    Mỗi message ghi `x-producer` và `x-consumers`. Thêm consumer mới không cần sửa producer; đổi phá vỡ payload thì
    tăng `schemaVersion` và phát song song hai phiên bản tới khi mọi consumer chuyển xong (architecture 3.6).
    Vỏ và schema dùng chung: `../internal/schemas.yaml`. Trạng thái giữ đúng chuỗi PRD 18.2.
  license:
    name: eTroy Non-Commercial License 1.0 (see LICENSES.md)
defaultContentType: application/json

servers:
  rabbitmq:
    host: rabbitmq.sires.svc.cluster.local:5671
    protocol: amqps
    description: RabbitMQ managed, cụm 3 node, quorum queue; một vhost mỗi môi trường.

channels:
  events:
    address: sires.events
    title: Sự kiện domain
    description: Topic exchange bền. Mỗi consumer có queue riêng `<service>.events` bind theo routing key cần nghe.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: sires.events, type: topic, durable: true, autoDelete: false, vhost: / }
    messages:
      accountCreated: { $ref: '#/components/messages/accountCreated' }
      accountDeletionRequested: { $ref: '#/components/messages/accountDeletionRequested' }
      providerConnectionChanged: { $ref: '#/components/messages/providerConnectionChanged' }
      providerConnectionIssueReported: { $ref: '#/components/messages/providerConnectionIssueReported' }
      embeddingModelChanged: { $ref: '#/components/messages/embeddingModelChanged' }
      projectLifecycleChanged: { $ref: '#/components/messages/projectLifecycleChanged' }
      projectPurgeDue: { $ref: '#/components/messages/projectPurgeDue' }
      messagePosted: { $ref: '#/components/messages/messagePosted' }
      researchContextVersioned: { $ref: '#/components/messages/researchContextVersioned' }
      pendingActionChanged: { $ref: '#/components/messages/pendingActionChanged' }
      notificationCreated: { $ref: '#/components/messages/notificationCreated' }
      planGenerationRequested: { $ref: '#/components/messages/planGenerationRequested' }
      planVersionStatusChanged: { $ref: '#/components/messages/planVersionStatusChanged' }
      taskActivated: { $ref: '#/components/messages/taskActivated' }
      taskActivationCancelled: { $ref: '#/components/messages/taskActivationCancelled' }
      taskStatusChanged: { $ref: '#/components/messages/taskStatusChanged' }
      workflowCreated: { $ref: '#/components/messages/workflowCreated' }
      workflowStatusChanged: { $ref: '#/components/messages/workflowStatusChanged' }
      agentRunStatusChanged: { $ref: '#/components/messages/agentRunStatusChanged' }
      promptStatusChanged: { $ref: '#/components/messages/promptStatusChanged' }
      referenceStatusChanged: { $ref: '#/components/messages/referenceStatusChanged' }
      referenceMetadataUpdated: { $ref: '#/components/messages/referenceMetadataUpdated' }
      referenceDeleted: { $ref: '#/components/messages/referenceDeleted' }
      projectReferenceChanged: { $ref: '#/components/messages/projectReferenceChanged' }
      referenceIndexingStatusChanged: { $ref: '#/components/messages/referenceIndexingStatusChanged' }
      researchObjectStatusChanged: { $ref: '#/components/messages/researchObjectStatusChanged' }
      manuscriptObjectStatusChanged: { $ref: '#/components/messages/manuscriptObjectStatusChanged' }
      auditRecorded: { $ref: '#/components/messages/auditRecorded' }
      dataPurged: { $ref: '#/components/messages/dataPurged' }

  agentRun:
    address: agent.run
    title: Lệnh chạy Agent Run
    description: Quorum queue; prefetch giới hạn ở agent-core; không retry tự động (architecture 5.2, 5.6).
    bindings:
      amqp:
        is: queue
        queue: { name: agent.run, durable: true, exclusive: false, autoDelete: false, vhost: / }
    messages:
      agentRunRequested: { $ref: '#/components/messages/agentRunRequested' }

  knowledgeIndex:
    address: knowledge.index
    title: Lệnh index tài liệu
    description: Nội bộ knowledge; được tự thử lại tối đa 3 lần vì idempotent theo (referenceId, sha256, embeddingModel) — INT-DOC-003.
    bindings:
      amqp:
        is: queue
        queue: { name: knowledge.index, durable: true, exclusive: false, autoDelete: false, vhost: / }
    messages:
      indexRequested: { $ref: '#/components/messages/indexRequested' }

  sandboxBuild:
    address: sandbox.build
    title: Lệnh build LaTeX / kiểm tra, render Mermaid
    description: Priority queue (mermaid_validate > build do người dùng bấm > build tự động) — architecture 9.5.
    bindings:
      amqp:
        is: queue
        queue: { name: sandbox.build, durable: true, exclusive: false, autoDelete: false, vhost: / }
    messages:
      sandboxJobRequested: { $ref: '#/components/messages/sandboxJobRequested' }

  sandboxReply:
    address: sandbox.reply.research
    title: Phản hồi Mermaid cho research
    description: |
      RPC qua `replyTo` + `correlationId` cho tool validate/render của Diagram Agent (research chờ ≤ 30 s / 120 s).
      Kết quả build LaTeX không đi qua đây mà qua REST `POST /internal/builds/{buildId}/result` của manuscript.
    bindings:
      amqp:
        is: queue
        queue: { name: sandbox.reply.research, durable: false, exclusive: false, autoDelete: true, vhost: / }
    messages:
      sandboxJobCompleted: { $ref: '#/components/messages/sandboxJobCompleted' }

  chatStream:
    address: sires.stream
    title: Stream chat
    description: Topic exchange không bền; mỗi pod gateway có queue tạm (exclusive, autoDelete). Không ghi log, không phát lại.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: sires.stream, type: topic, durable: false, autoDelete: false, vhost: / }
    messages:
      chatDelta: { $ref: '#/components/messages/chatDelta' }

operations:
  # ---- producer ----
  identityPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    title: identity phát
    messages:
      - $ref: '#/channels/events/messages/accountCreated'
      - $ref: '#/channels/events/messages/accountDeletionRequested'
      - $ref: '#/channels/events/messages/providerConnectionChanged'
      - $ref: '#/channels/events/messages/providerConnectionIssueReported'
      - $ref: '#/channels/events/messages/embeddingModelChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  workspacePublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    title: workspace phát
    messages:
      - $ref: '#/channels/events/messages/projectLifecycleChanged'
      - $ref: '#/channels/events/messages/projectPurgeDue'
      - $ref: '#/channels/events/messages/messagePosted'
      - $ref: '#/channels/events/messages/researchContextVersioned'
      - $ref: '#/channels/events/messages/pendingActionChanged'
      - $ref: '#/channels/events/messages/notificationCreated'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  planningPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    title: planning phát
    messages:
      - $ref: '#/channels/events/messages/planGenerationRequested'
      - $ref: '#/channels/events/messages/planVersionStatusChanged'
      - $ref: '#/channels/events/messages/taskActivated'
      - $ref: '#/channels/events/messages/taskActivationCancelled'
      - $ref: '#/channels/events/messages/taskStatusChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  orchestrationPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    title: orchestration phát
    messages:
      - $ref: '#/channels/events/messages/workflowCreated'
      - $ref: '#/channels/events/messages/workflowStatusChanged'
      - $ref: '#/channels/events/messages/agentRunStatusChanged'
      - $ref: '#/channels/events/messages/promptStatusChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  libraryPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    title: library phát
    messages:
      - $ref: '#/channels/events/messages/referenceStatusChanged'
      - $ref: '#/channels/events/messages/referenceMetadataUpdated'
      - $ref: '#/channels/events/messages/referenceDeleted'
      - $ref: '#/channels/events/messages/projectReferenceChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  knowledgePublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    title: knowledge phát
    messages:
      - $ref: '#/channels/events/messages/referenceIndexingStatusChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  researchPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    title: research phát
    messages:
      - $ref: '#/channels/events/messages/researchObjectStatusChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  manuscriptPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    title: manuscript phát
    messages:
      - $ref: '#/channels/events/messages/manuscriptObjectStatusChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  auditPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    title: audit phát
    messages:
      - $ref: '#/channels/events/messages/dataPurged'
  orchestrationSendsAgentRun:
    action: send
    channel: { $ref: '#/channels/agentRun' }
    title: orchestration giao Agent Run
  knowledgeSendsIndex:
    action: send
    channel: { $ref: '#/channels/knowledgeIndex' }
    title: knowledge xếp việc index
  manuscriptSendsSandboxJob:
    action: send
    channel: { $ref: '#/channels/sandboxBuild' }
    title: manuscript gửi build LaTeX
  researchSendsSandboxJob:
    action: send
    channel: { $ref: '#/channels/sandboxBuild' }
    title: research gửi kiểm tra/render Mermaid
    reply:
      channel: { $ref: '#/channels/sandboxReply' }
  sandboxRunnerReplies:
    action: send
    channel: { $ref: '#/channels/sandboxReply' }
    title: sandbox-runner trả kết quả Mermaid
  agentCoreStreamsChat:
    action: send
    channel: { $ref: '#/channels/chatStream' }
    title: agent-core phát delta chat

  # ---- consumer ----
  gatewayConsumesForSse:
    action: receive
    channel: { $ref: '#/channels/events' }
    title: gateway đẩy SSE và ghi log sự kiện 24 giờ (F-03)
    messages:
      - $ref: '#/channels/events/messages/providerConnectionChanged'
      - $ref: '#/channels/events/messages/providerConnectionIssueReported'
      - $ref: '#/channels/events/messages/projectLifecycleChanged'
      - $ref: '#/channels/events/messages/pendingActionChanged'
      - $ref: '#/channels/events/messages/notificationCreated'
      - $ref: '#/channels/events/messages/planVersionStatusChanged'
      - $ref: '#/channels/events/messages/taskStatusChanged'
      - $ref: '#/channels/events/messages/workflowStatusChanged'
      - $ref: '#/channels/events/messages/agentRunStatusChanged'
      - $ref: '#/channels/events/messages/promptStatusChanged'
      - $ref: '#/channels/events/messages/referenceStatusChanged'
      - $ref: '#/channels/events/messages/referenceIndexingStatusChanged'
      - $ref: '#/channels/events/messages/projectReferenceChanged'
      - $ref: '#/channels/events/messages/researchObjectStatusChanged'
      - $ref: '#/channels/events/messages/manuscriptObjectStatusChanged'
      - $ref: '#/channels/events/messages/accountDeletionRequested'
  gatewayConsumesChat:
    action: receive
    channel: { $ref: '#/channels/chatStream' }
    title: gateway chuyển delta thành SSE chat.delta
  identityConsumes:
    action: receive
    channel: { $ref: '#/channels/events' }
    title: identity theo dõi xác nhận xóa tài khoản
    messages:
      - $ref: '#/channels/events/messages/dataPurged'
  workspaceConsumes:
    action: receive
    channel: { $ref: '#/channels/events' }
    title: workspace tạo PendingAction, Notification; theo dõi purge project
    messages:
      - $ref: '#/channels/events/messages/accountDeletionRequested'
      - $ref: '#/channels/events/messages/providerConnectionIssueReported'
      - $ref: '#/channels/events/messages/planVersionStatusChanged'
      - $ref: '#/channels/events/messages/taskStatusChanged'
      - $ref: '#/channels/events/messages/workflowStatusChanged'
      - $ref: '#/channels/events/messages/promptStatusChanged'
      - $ref: '#/channels/events/messages/referenceStatusChanged'
      - $ref: '#/channels/events/messages/manuscriptObjectStatusChanged'
      - $ref: '#/channels/events/messages/dataPurged'
  planningConsumes:
    action: receive
    channel: { $ref: '#/channels/events' }
    title: planning chuyển trạng thái Task theo workflow; gắn needs review
    messages:
      - $ref: '#/channels/events/messages/accountDeletionRequested'
      - $ref: '#/channels/events/messages/projectLifecycleChanged'
      - $ref: '#/channels/events/messages/projectPurgeDue'
      - $ref: '#/channels/events/messages/researchContextVersioned'
      - $ref: '#/channels/events/messages/workflowCreated'
      - $ref: '#/channels/events/messages/workflowStatusChanged'
      - $ref: '#/channels/events/messages/referenceStatusChanged'
      - $ref: '#/channels/events/messages/researchObjectStatusChanged'
  orchestrationConsumes:
    action: receive
    channel: { $ref: '#/channels/events' }
    title: orchestration tạo workflow, đóng/hủy prompt
    messages:
      - $ref: '#/channels/events/messages/accountDeletionRequested'
      - $ref: '#/channels/events/messages/projectLifecycleChanged'
      - $ref: '#/channels/events/messages/projectPurgeDue'
      - $ref: '#/channels/events/messages/messagePosted'
      - $ref: '#/channels/events/messages/planGenerationRequested'
      - $ref: '#/channels/events/messages/planVersionStatusChanged'
      - $ref: '#/channels/events/messages/taskActivated'
      - $ref: '#/channels/events/messages/taskActivationCancelled'
      - $ref: '#/channels/events/messages/referenceStatusChanged'
  libraryConsumes:
    action: receive
    channel: { $ref: '#/channels/events' }
    title: library cập nhật indexingStatus; xóa dữ liệu
    messages:
      - $ref: '#/channels/events/messages/accountDeletionRequested'
      - $ref: '#/channels/events/messages/projectLifecycleChanged'
      - $ref: '#/channels/events/messages/projectPurgeDue'
      - $ref: '#/channels/events/messages/referenceIndexingStatusChanged'
  knowledgeConsumes:
    action: receive
    channel: { $ref: '#/channels/events' }
    title: knowledge index, cập nhật phạm vi truy xuất, index lại khi đổi model
    messages:
      - $ref: '#/channels/events/messages/accountDeletionRequested'
      - $ref: '#/channels/events/messages/embeddingModelChanged'
      - $ref: '#/channels/events/messages/referenceStatusChanged'
      - $ref: '#/channels/events/messages/referenceDeleted'
      - $ref: '#/channels/events/messages/projectReferenceChanged'
      - $ref: '#/channels/events/messages/projectLifecycleChanged'
  researchConsumes:
    action: receive
    channel: { $ref: '#/channels/events' }
    title: research chuyển evidence Stale, gắn needs review
    messages:
      - $ref: '#/channels/events/messages/accountDeletionRequested'
      - $ref: '#/channels/events/messages/projectLifecycleChanged'
      - $ref: '#/channels/events/messages/projectPurgeDue'
      - $ref: '#/channels/events/messages/referenceStatusChanged'
      - $ref: '#/channels/events/messages/referenceDeleted'
      - $ref: '#/channels/events/messages/projectReferenceChanged'
  manuscriptConsumes:
    action: receive
    channel: { $ref: '#/channels/events' }
    title: manuscript cập nhật bản sao trạng thái reference và bibliography
    messages:
      - $ref: '#/channels/events/messages/accountDeletionRequested'
      - $ref: '#/channels/events/messages/projectLifecycleChanged'
      - $ref: '#/channels/events/messages/projectPurgeDue'
      - $ref: '#/channels/events/messages/referenceStatusChanged'
      - $ref: '#/channels/events/messages/referenceMetadataUpdated'
      - $ref: '#/channels/events/messages/referenceDeleted'
  auditConsumes:
    action: receive
    channel: { $ref: '#/channels/events' }
    title: audit lưu Audit Event chỉ ghi thêm (ADR-23); xóa theo vòng đời
    messages:
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/accountDeletionRequested'
      - $ref: '#/channels/events/messages/projectPurgeDue'
  agentCoreReceivesAgentRun:
    action: receive
    channel: { $ref: '#/channels/agentRun' }
    title: agent-core thực thi Agent Run (bắt tay start trước khi gọi provider)
  knowledgeReceivesIndex:
    action: receive
    channel: { $ref: '#/channels/knowledgeIndex' }
    title: knowledge chạy pipeline indexing
  sandboxRunnerReceivesJob:
    action: receive
    channel: { $ref: '#/channels/sandboxBuild' }
    title: sandbox-runner chạy job trong sandbox
  researchReceivesSandboxReply:
    action: receive
    channel: { $ref: '#/channels/sandboxReply' }
    title: research nhận kết quả Mermaid

components:
  messageTraits:
    envelopeHeaders:
      headers:
        type: object
        properties:
          traceparent: { type: string, description: W3C trace context (NFR-OBS-004). }
          message_id: { type: string, description: Bằng `id` của vỏ sự kiện. }
      bindings:
        amqp:
          deliveryMode: 2
          bindingVersion: 0.3.0

  schemas:
    Envelope:
      $ref: ../internal/schemas.yaml#/EventEnvelope
    StateChange:
      $ref: ../internal/schemas.yaml#/StateChange
    Id:
      $ref: ../components/schemas/common.yaml#/Id

  messages:
    # ---------- identity ----------
    accountCreated:
      name: account.created
      title: Tài khoản SIRes được tạo lần đầu từ eTroy OIDC
      x-producer: identity
      x-consumers: [audit]
      x-requirements: [INT-OIDC-002]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: account.created }
              data:
                type: object
                required: [issuer]
                properties:
                  issuer: { type: string }
    accountDeletionRequested:
      name: account.deletion_requested
      title: Researcher yêu cầu xóa tài khoản — mọi service xóa dữ liệu trong ≤ 30 ngày
      x-producer: identity
      x-consumers: [gateway, workspace, planning, orchestration, library, research, manuscript, knowledge, audit]
      x-requirements: [NFR-RET-004]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: account.deletion_requested }
              data:
                type: object
                required: [purgeBefore]
                properties:
                  purgeBefore: { type: string, format: date-time }
    providerConnectionChanged:
      name: provider_connection.changed
      title: Provider Connection tạo, sửa, xóa key hoặc đổi trạng thái kiểm tra
      x-producer: identity
      x-consumers: [gateway]
      x-requirements: [AGENT-PROVIDER-001, NFR-SECRETS-003]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: provider_connection.changed }
              data:
                type: object
                required: [connectionId, change]
                properties:
                  connectionId: { $ref: '#/components/schemas/Id' }
                  change: { type: string, enum: [created, updated, key_replaced, key_deleted, deleted, test_status_changed] }
                  testStatus: { type: string }
    providerConnectionIssueReported:
      name: provider_connection.issue_reported
      title: Lỗi cố định của provider (auth_failed, quota_exceeded…) — tạo Notification Provider issue
      x-producer: identity
      x-consumers: [workspace, gateway]
      x-requirements: [INT-PROVIDER-004]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: provider_connection.issue_reported }
              data:
                type: object
                required: [connectionId, code]
                properties:
                  connectionId: { $ref: '#/components/schemas/Id' }
                  code: { type: string }
                  agentRunId: { $ref: '#/components/schemas/Id' }
    embeddingModelChanged:
      name: embedding_model.changed
      title: Tài khoản đổi embedding model — index lại toàn bộ thư viện
      x-producer: identity
      x-consumers: [knowledge]
      x-requirements: [INT-VECTOR-003, DEC-31]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: embedding_model.changed }
              data:
                type: object
                required: [providerConnectionId, model]
                properties:
                  providerConnectionId: { $ref: '#/components/schemas/Id' }
                  model: { type: string }
                  previousModel: { type: string }

    # ---------- workspace ----------
    projectLifecycleChanged:
      name: project.lifecycle_changed
      title: Project tạo, lưu trữ, xóa mềm hoặc khôi phục
      description: Routing key con theo `data.change` — `project.lifecycle_changed.<change>`. archived → prompt Expired; deleted → ẩn dữ liệu ở mọi service.
      x-producer: workspace
      x-consumers: [gateway, planning, orchestration, library, research, manuscript, knowledge]
      x-requirements: [PROJ-CRUD-001, NFR-RET-002, DEC-29]
      traits: [{ $ref: '#/components/messageTraits/envelopeHeaders' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: project.lifecycle_changed }
              data:
                type: object
                required: [change, status]
                properties:
                  change: { type: string, enum: [created, archived, unarchived, deleted, restored] }
                  status: { type: string }
                  purgeAfter: { type: string, format: date-time }
    projectPurgeDue:
      name: project.purge_due
      title: Hết hạn 30 ngày xóa mềm — mọi service xóa vĩnh viễn dữ liệu cấp project và báo data.purged
      x-producer: workspace
