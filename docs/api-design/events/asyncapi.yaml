      - $ref: '#/channels/events/messages/taskActivationCancelled'
      - $ref: '#/channels/events/messages/taskStatusChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  orchestrationPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    traits: [{ $ref: '#/components/operationTraits/persistentSend' }]
    title: orchestration phát
    messages:
      - $ref: '#/channels/events/messages/workflowCreated'
      - $ref: '#/channels/events/messages/workflowStatusChanged'
      - $ref: '#/channels/events/messages/agentRunStatusChanged'
      - $ref: '#/channels/events/messages/promptStatusChanged'
      - $ref: '#/channels/events/messages/deliberationStarted'
      - $ref: '#/channels/events/messages/deliberationRoundClosed'
      - $ref: '#/channels/events/messages/deliberationEntryAdded'
      - $ref: '#/channels/events/messages/deliberationEntryFinalized'
      - $ref: '#/channels/events/messages/deliberationEntryRetracted'
      - $ref: '#/channels/events/messages/deliberationStatusChanged'
      - $ref: '#/channels/events/messages/contextSnapshotOutdated'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  libraryPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    traits: [{ $ref: '#/components/operationTraits/persistentSend' }]
    title: library phát
    messages:
      - $ref: '#/channels/events/messages/referenceStatusChanged'
      - $ref: '#/channels/events/messages/referenceMetadataUpdated'
      - $ref: '#/channels/events/messages/referenceDeleted'
      - $ref: '#/channels/events/messages/projectReferenceChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  knowledgePublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    traits: [{ $ref: '#/components/operationTraits/persistentSend' }]
    title: knowledge phát
    messages:
      - $ref: '#/channels/events/messages/referenceIndexingStatusChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  researchPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    traits: [{ $ref: '#/components/operationTraits/persistentSend' }]
    title: research phát
    messages:
      - $ref: '#/channels/events/messages/researchObjectStatusChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
      - $ref: '#/channels/events/messages/dataPurged'
  manuscriptPublishes:
    action: send
    channel: { $ref: '#/channels/events' }
    traits: [{ $ref: '#/components/operationTraits/persistentSend' }]
    title: manuscript phát
    messages:
      - $ref: '#/channels/events/messages/manuscriptObjectStatusChanged'
      - $ref: '#/channels/events/messages/auditRecorded'
