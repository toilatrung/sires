asyncapi: 3.0.0
info:
  title: SIRes events and commands
  version: 0.1.0-mvp
  description: |
    Hợp đồng messaging giữa các service SIRes qua RabbitMQ (ADR-19, ADR-20).

    - **Sự kiện** trên topic exchange `sires.events`: routing key = `type` của sự kiện; với sự kiện đổi trạng thái
      (data là StateChange hoặc có `change`) thêm một đoạn con = trạng thái đích viết thường, khoảng trắng thành `_`,
      ví dụ `workflow.status_changed.waiting_for_user`, `reference.status_changed.trusted`,
      `project.lifecycle_changed.archived` — consumer bind `workflow.status_changed.*` hoặc đúng trạng thái cần. Mỗi sự kiện được ghi vào bảng
      outbox của service phát trong cùng giao dịch với thay đổi (architecture 6.4), relay publish với publisher confirm.
      Giao ít nhất một lần; consumer idempotent bằng bảng inbox theo `id`, bỏ qua bản có `aggregate.version` cũ hơn.
    - **Lệnh** trên queue riêng (`agent.run`, `knowledge.index`, `sandbox.build`): một consumer nhận, ack thủ công.
      Trạng thái thật nằm ở database của service gửi lệnh; lệnh lỗi thời bị từ chối ở bước bắt tay.
    - **Stream** trên exchange `sires.stream` (không bền): delta chat, mất thì bỏ qua.

    Mỗi message ghi `x-producer` và `x-consumers`. Thêm consumer mới không cần sửa producer; đổi phá vỡ payload thì
    tăng `schemaVersion` và phát song song hai phiên bản tới khi mọi consumer chuyển xong (architecture 3.6).
    Vỏ và schema dùng chung: `../internal/schemas.yaml`. Trạng thái giữ đúng chuỗi PRD 18.2.
  license:
    name: eTroy Non-Commercial License 1.0 (see LICENSES.md)
    url: https://github.com/toilatrung/sires/blob/main/LICENSES.md
defaultContentType: application/json

servers:
  rabbitmq:
    host: rabbitmq.sires.svc.cluster.local:5671
    protocol: amqps
    description: RabbitMQ managed, cụm 3 node, quorum queue; một vhost mỗi môi trường.
    security:
      - $ref: '#/components/securitySchemes/serviceCredentials'

channels:
  events:
    address: sires.events
    title: Sự kiện domain
    description: Topic exchange bền. Mỗi consumer có queue riêng `<service>.events` bind theo routing key cần nghe.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: sires.events, type: topic, durable: true, autoDelete: false, vhost: / }
    messages:
      accountCreated: { $ref: '#/components/messages/accountCreated' }
      accountDeletionRequested: { $ref: '#/components/messages/accountDeletionRequested' }
      providerConnectionChanged: { $ref: '#/components/messages/providerConnectionChanged' }
      providerConnectionIssueReported: { $ref: '#/components/messages/providerConnectionIssueReported' }
      embeddingModelChanged: { $ref: '#/components/messages/embeddingModelChanged' }
      projectLifecycleChanged: { $ref: '#/components/messages/projectLifecycleChanged' }
      projectPurgeDue: { $ref: '#/components/messages/projectPurgeDue' }
      messagePosted: { $ref: '#/components/messages/messagePosted' }
      researchContextVersioned: { $ref: '#/components/messages/researchContextVersioned' }
      pendingActionChanged: { $ref: '#/components/messages/pendingActionChanged' }
      notificationCreated: { $ref: '#/components/messages/notificationCreated' }
      planGenerationRequested: { $ref: '#/components/messages/planGenerationRequested' }
      planVersionStatusChanged: { $ref: '#/components/messages/planVersionStatusChanged' }
      taskActivated: { $ref: '#/components/messages/taskActivated' }
      taskActivationCancelled: { $ref: '#/components/messages/taskActivationCancelled' }
      taskStatusChanged: { $ref: '#/components/messages/taskStatusChanged' }
      workflowCreated: { $ref: '#/components/messages/workflowCreated' }
      workflowStatusChanged: { $ref: '#/components/messages/workflowStatusChanged' }
      agentRunStatusChanged: { $ref: '#/components/messages/agentRunStatusChanged' }
      promptStatusChanged: { $ref: '#/components/messages/promptStatusChanged' }
      deliberationStarted: { $ref: '#/components/messages/deliberationStarted' }
      deliberationRoundClosed: { $ref: '#/components/messages/deliberationRoundClosed' }
      deliberationEntryAdded: { $ref: '#/components/messages/deliberationEntryAdded' }
      deliberationEntryFinalized: { $ref: '#/components/messages/deliberationEntryFinalized' }
      deliberationEntryRetracted: { $ref: '#/components/messages/deliberationEntryRetracted' }
      deliberationStatusChanged: { $ref: '#/components/messages/deliberationStatusChanged' }
      contextSnapshotOutdated: { $ref: '#/components/messages/contextSnapshotOutdated' }
      referenceStatusChanged: { $ref: '#/components/messages/referenceStatusChanged' }
      referenceMetadataUpdated: { $ref: '#/components/messages/referenceMetadataUpdated' }
      referenceDeleted: { $ref: '#/components/messages/referenceDeleted' }
      projectReferenceChanged: { $ref: '#/components/messages/projectReferenceChanged' }
      referenceIndexingStatusChanged: { $ref: '#/components/messages/referenceIndexingStatusChanged' }
      researchObjectStatusChanged: { $ref: '#/components/messages/researchObjectStatusChanged' }
      manuscriptObjectStatusChanged: { $ref: '#/components/messages/manuscriptObjectStatusChanged' }
      auditRecorded: { $ref: '#/components/messages/auditRecorded' }
      dataPurged: { $ref: '#/components/messages/dataPurged' }

  agentRun:
    address: agent.run
    title: Lệnh chạy Agent Run
    description: Quorum queue; prefetch giới hạn ở agent-core; không retry tự động (architecture 5.2, 5.6).
    bindings:
      amqp:
        is: queue
        queue: { name: agent.run, durable: true, exclusive: false, autoDelete: false, vhost: / }
    messages:
      agentRunRequested: { $ref: '#/components/messages/agentRunRequested' }

  knowledgeIndex:
    address: knowledge.index
    title: Lệnh index tài liệu
    description: Nội bộ knowledge; được tự thử lại tối đa 3 lần vì idempotent theo (referenceId, sha256, embeddingModel) — INT-DOC-003.
    bindings:
      amqp:
        is: queue
        queue: { name: knowledge.index, durable: true, exclusive: false, autoDelete: false, vhost: / }
    messages:
      indexRequested: { $ref: '#/components/messages/indexRequested' }

  sandboxBuild:
    address: sandbox.build
    title: Lệnh build LaTeX / kiểm tra, render Mermaid
    description: Priority queue (mermaid_validate > build do người dùng bấm > build tự động) — architecture 9.5.
    bindings:
      amqp:
        is: queue
        queue: { name: sandbox.build, durable: true, exclusive: false, autoDelete: false, vhost: / }
    messages:
      sandboxJobRequested: { $ref: '#/components/messages/sandboxJobRequested' }

  sandboxReply:
    address: sandbox.reply.research
    title: Phản hồi Mermaid cho research
    description: |
      RPC qua `replyTo` + `correlationId` cho tool validate/render của Diagram Agent (research chờ ≤ 30 s / 120 s).
      Kết quả build LaTeX không đi qua đây mà qua REST `POST /internal/builds/{buildId}/result` của manuscript.
    bindings:
      amqp:
        is: queue
        queue: { name: sandbox.reply.research, durable: false, exclusive: false, autoDelete: true, vhost: / }
    messages:
      sandboxJobCompleted: { $ref: '#/components/messages/sandboxJobCompleted' }

  chatStream:
    address: sires.stream
    title: Stream chat
    description: Topic exchange không bền; mỗi pod gateway có queue tạm (exclusive, autoDelete). Không ghi log, không phát lại.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: sires.stream, type: topic, durable: false, autoDelete: false, vhost: / }
    messages:
      chatDelta: { $ref: '#/components/messages/chatDelta' }

