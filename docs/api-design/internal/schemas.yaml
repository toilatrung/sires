# Schema dùng chung cho hợp đồng nội bộ giữa các service (OpenAPI trong internal/*.yaml)
# và cho payload sự kiện/lệnh (AsyncAPI trong events/asyncapi.yaml).
# Kiến trúc: docs/architecture/sections/03 (service), 04 (luồng F-01–F-12), 05 (engine), 10.4 (token nội bộ).
# Schema domain dùng lại từ ../components/schemas/ — không định nghĩa lại entity của PRD 18.1.

ServiceName:
  type: string
  description: Tên service (architecture 3.2).
  enum: [gateway, identity, workspace, planning, orchestration, library, research, manuscript, audit,
    sandbox-runner, agent-core, knowledge]

ServiceTokenClaims:
  type: object
  description: |
    Nội dung JWT nội bộ (ADR-20) gửi ở header `Authorization: Bearer …`. Ký bằng khóa trong KMS, hạn ≤ 5 phút.
    Chỉ gateway phát token có `act.type = researcher` (từ phiên đăng nhập); token do orchestration cấp cho
    Agent Run luôn có `act.type = agent`. Service nhận tự kiểm tra quyền theo token, không tin service gọi.
  required: [iss, sub, aud, exp, act]
  properties:
    iss: { type: string, examples: [sires-internal] }
    sub: { $ref: '#/ServiceName' }
    aud: { $ref: '#/ServiceName' }
    exp: { type: integer }
    act: { $ref: ../components/schemas/common.yaml#/ActorRef }
    accountId: { $ref: ../components/schemas/common.yaml#/Id }
    projectId: { $ref: ../components/schemas/common.yaml#/Id }
    agentRunId: { $ref: ../components/schemas/common.yaml#/Id }
    agentScope:
      type: object
      description: Phạm vi agent lấy từ agent registry (PRD 3.3, architecture 5.10). Service đọc từ chối entity ngoài phạm vi.
      properties:
        read:
          type: array
          items: { type: string, examples: [evidence, "artifact:Accepted", research_context] }
        taskIds:
          type: array
          description: Task được phép đọc Context Item phạm vi task (Task hiện hành và Task phụ thuộc trực tiếp).
          items: { $ref: ../components/schemas/common.yaml#/Id }

# ---------- Lắp ráp context (CTX-ASSEMBLY-001) ----------

ContextLayer:
  type: integer
  minimum: 1
  maximum: 7
  description: Lớp context theo bảng ưu tiên PRD 14.2 (1–3 không bao giờ bị cắt).

ContextEntry:
  type: object
  description: Một mục context trả cho Context Assembler; luôn có tham chiếu có phiên bản để ghi vào context manifest.
  required: [ref, layer, content]
  properties:
    ref: { $ref: ../components/schemas/common.yaml#/TypedRef }
    layer: { $ref: '#/ContextLayer' }
    title: { type: string }
    content:
      type: object
      additionalProperties: true
      description: Nội dung có cấu trúc của entity.
    summary:
      type: string
      description: Bản tóm tắt có sẵn, dùng khi phải cắt lớp 4 hoặc 6 (không gọi model để tóm tắt — OQ-035).
    approxTokens: { type: integer, description: Ước lượng của service nguồn; Context Assembler tính lại. }

ContextBundle:
  type: object
  required: [entries]
  properties:
    entries:
      type: array
      items: { $ref: '#/ContextEntry' }
    omitted:
      type: array
      description: Tham chiếu được yêu cầu nhưng không trả (ngoài phạm vi agent, không tồn tại, chưa Accepted).
      items:
        type: object
        required: [ref, reason]
        properties:
          ref: { $ref: ../components/schemas/common.yaml#/TypedRef }
          reason:
            type: string
            enum: [out_of_scope, not_found, not_accepted, deleted]

ContextBundleRequest:
  type: object
  required: [refs]
  properties:
    refs:
      type: array
      maxItems: 200
      items: { $ref: ../components/schemas/common.yaml#/TypedRef }
    includeDrafts:
      type: boolean
      default: false
      description: Chỉ true khi bước đang xử lý chính bản nháp đó (PRD 14.2).

# ---------- Agent Run giữa orchestration và agent-core ----------

AgentRunAssignment:
  type: object
  description: Payload lệnh `agent.run` — chỉ mang định danh; chi tiết lấy ở bước bắt tay `start` để không chạy dữ liệu cũ.
  required: [agentRunId, workflowId, stepId, accountId, agent, attempt]
  properties:
    agentRunId: { $ref: ../components/schemas/common.yaml#/Id }
    workflowId: { $ref: ../components/schemas/common.yaml#/Id }
    stepId: { $ref: ../components/schemas/common.yaml#/Id }
    accountId: { $ref: ../components/schemas/common.yaml#/Id }
    projectId: { $ref: ../components/schemas/common.yaml#/Id }
    taskId: { $ref: ../components/schemas/common.yaml#/Id }
    agent: { $ref: ../components/schemas/common.yaml#/AgentName }
    instance:
      allOf:
        - $ref: ../components/schemas/common.yaml#/AgentInstance
      description: Chỉ khi agent = `analysis` (DEC-47).
    deliberationId:
      allOf:
        - $ref: ../components/schemas/common.yaml#/Id
      description: Có khi Agent Run thuộc một phiên thảo luận (ORCH-DELIB-002).
    attempt: { type: integer, minimum: 1, maximum: 3, description: Lần thứ mấy của bước (tối đa 1 + 2 Agent Run mới — 8.5). }
    priority:
      type: string
      enum: [interactive, background]
      description: interactive cho chat của Orchestrator.

AgentRunWorkOrder:
  type: object
  description: Chi tiết công việc orchestration trả khi agent-core bắt tay thành công.
  required: [agentRunId, agent, agentVersion, goal, inputRefs, providerConnectionId, model, serviceToken, debugMode]
  properties:
    agentRunId: { $ref: ../components/schemas/common.yaml#/Id }
    workflowId: { $ref: ../components/schemas/common.yaml#/Id }
    workflowType: { $ref: ../components/schemas/orchestration.yaml#/WorkflowType }
    stepId: { $ref: ../components/schemas/common.yaml#/Id }
    projectId: { $ref: ../components/schemas/common.yaml#/Id }
    taskId: { $ref: ../components/schemas/common.yaml#/Id }
    conversationId: { $ref: ../components/schemas/common.yaml#/Id }
    agent: { $ref: ../components/schemas/common.yaml#/AgentName }
    instance:
      allOf:
        - $ref: ../components/schemas/common.yaml#/AgentInstance
      description: Chỉ khi agent = `analysis`; Agent Model Assignment lấy theo (agent, instance).
    deliberation:
      type: object
      description: |
        Có khi Agent Run thuộc phiên thảo luận. Context lắp ráp từ Context Snapshot của phiên (CTX-SNAPSHOT-001); entry
        đọc qua `GET /internal/workflows/{workflowId}/board` (orchestration lọc theo quyền xem theo vòng).
      required: [deliberationId, round, contextSnapshotId]
      properties:
        deliberationId: { $ref: ../components/schemas/common.yaml#/Id }
        round: { type: integer, minimum: 0 }
        roundKind: { $ref: ../components/schemas/orchestration.yaml#/DeliberationRoundKind }
        problemType: { $ref: ../components/schemas/orchestration.yaml#/ProblemType }
        perspective: { type: string, description: Góc nhìn Orchestrator giao cho bên này trong Problem Brief (ORCH-DELIB-005). }
        contextSnapshotId: { $ref: ../components/schemas/common.yaml#/Id }
        narrowFocus: { type: string, description: Điểm bất đồng của vòng hẹp. }
    agentVersion: { type: string, description: Phiên bản định nghĩa agent mà StepPlan đã kiểm tra. }
    goal: { type: string, description: Mục tiêu bước do Orchestrator lập (StepPlan). }
    inputRefs:
      type: array
      items: { $ref: ../components/schemas/common.yaml#/TypedRef }
    expectedOutput: { type: string }
    previousError:
      type: object
      description: Lỗi của lần chạy trước cùng bước (khi attempt > 1) hoặc phản hồi trả lại Task.
      properties:
        code: { type: string }
        message: { type: string }
    providerConnectionId: { $ref: ../components/schemas/common.yaml#/Id }
    model: { type: string }
    serviceToken:
      type: string
      description: JWT nội bộ (ServiceTokenClaims) có act = agent và agentScope; dùng cho mọi lời gọi đọc của Agent Run này.
    debugMode: { type: boolean, description: Chế độ debug của tài khoản tại thời điểm bắt đầu (CTX-REGISTRY-002). }
    responseLanguage: { $ref: ../components/schemas/common.yaml#/Language }
    stream: { type: boolean, description: true với lượt chat của Orchestrator (NFR-PERF-005). }

AgentRunControl:
  type: object
  description: Phản hồi heartbeat.
  required: [cancelRequested]
  properties:
    cancelRequested: { type: boolean, description: Workflow bị hủy — agent-core hủy lời gọi provider đang chờ (architecture 5.5). }

AgentRunUsage:
  description: |
    Dùng đúng schema `AgentRunUsage` của API công khai (NFR-USAGE-001): orchestration lưu nguyên giá trị agent-core gửi,
    không ước tính, để tổng phiên và tổng theo bên (`UsageTotal`) cộng lại khớp tổng Agent Run (NFR-USAGE-005).
  allOf:
    - $ref: ../components/schemas/orchestration.yaml#/AgentRunUsage

AgentOutput:
  type: object
  description: |
    Một đầu ra của Agent Run, orchestration ghi vào service sở hữu với idempotency key `agentRunId:index` (architecture 5.8).
    `payload` theo schema tạo mới của service đích (ví dụ PlanVersionCreate, ArtifactVersionCreate, EvidenceWrite…).
  required: [index, kind, payload]
  properties:
    index: { type: integer, minimum: 0 }
    kind:
      type: string
      enum: [plan_version, discovered_results, reference_proposals, evidence, claims, artifact_version,
        verification_results, change_proposal, message, context_item, prompt, step_plan, readiness_semantic,
        deliberation_entry]
      description: |
        `deliberation_entry` — payload `DeliberationEntryWrite`; orchestration tự ghi vào board (service sở hữu), entry thành
        `final` khi run Succeeded. Với mọi kind khác, orchestration từ chối đầu ra có `TypedRef` loại `deliberation_entry`
        trỏ tới entry chưa `final` (`draft_reference`, CTX-BOARD-003) trước khi chuyển sang service đích.
    payload:
      type: object
      additionalProperties: true

AgentRunResult:
  type: object
  required: [contextManifest, structuredOutput, outputs, usage, attempts, provider, model, adapterVersion,
    promptTemplateVersion]
  properties:
    contextManifest: { $ref: '#/ContextManifest' }
    structuredOutput:
      type: object
      additionalProperties: true
    outputs:
      type: array
      items: { $ref: '#/AgentOutput' }
    toolCalls:
      type: array
      items:
        type: object
        properties:
          name: { type: string }
          argumentsSummary: { type: string }
          resultSummary: { type: string }
    usage: { $ref: '#/AgentRunUsage' }
    attempts: { type: integer, minimum: 1 }
    provider: { $ref: ../components/schemas/common.yaml#/ProviderName }
    model: { type: string }
    adapterVersion: { type: string }
    capabilitiesUsed:
      type: array
      items: { type: string }
    promptTemplateVersion: { type: string }
    retrievalConfigVersion: { type: string, description: Có khi Agent Run dùng truy xuất (NFR-OBS-006). }
    embeddingModel: { type: string }
    rejectedItems:
      type: array
      description: Mục bị loại bởi kiểm tra tất định (quote không có thật, tham chiếu ngoài manifest — architecture 7.5).
      items:
        type: object
        properties:
          index: { type: integer }
          reason: { type: string, enum: [quote_not_found, ref_out_of_manifest, schema_invalid] }
    debugTranscriptRef:
      type: string
      description: Khóa object storage của toàn văn (mã hóa) khi debugMode = true.

ContextManifest:
  type: object
  description: CTX-ASSEMBLY-001 — entity, phiên bản và evidence đã đưa vào context; phần bị cắt và lý do.
  required: [entities]
  properties:
    entities:
      type: array
      items: { $ref: ../components/schemas/common.yaml#/TypedRef }
    evidenceIds:
      type: array
      items: { $ref: ../components/schemas/common.yaml#/Id }
    chunkIds:
      type: array
      items: { $ref: ../components/schemas/common.yaml#/Id }
    truncated:
      type: array
      items:
        type: object
        properties:
          layer: { $ref: '#/ContextLayer' }
          reason: { type: string }
    researchFieldIncluded: { type: boolean }

AgentRunFailure:
  type: object
  required: [error, attempts]
  properties:
    error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: ../components/schemas/common.yaml#/ProviderErrorCode }
        message: { type: string }
    attempts: { type: integer }
    usage: { $ref: '#/AgentRunUsage' }
    contextManifest: { $ref: '#/ContextManifest' }

# ---------- Ghi đầu ra từ orchestration vào service sở hữu ----------

AgentWriteMeta:
  type: object
  description: Kèm mọi lệnh ghi đầu ra của agent; service đích lưu thành provenance (18.3) và kiểm tra `idempotencyKey`.
  required: [agentRunId, outputIndex, provenance]
  properties:
    agentRunId: { $ref: ../components/schemas/common.yaml#/Id }
    outputIndex: { type: integer }
    provenance: { $ref: ../components/schemas/common.yaml#/Provenance }

WriteAck:
  type: object
  description: Xác nhận ghi; gửi lại cùng idempotency key trả lại đúng xác nhận cũ.
  required: [refs]
  properties:
    refs:
      type: array
      items: { $ref: ../components/schemas/common.yaml#/TypedRef }
    rejected:
      type: array
      items:
        type: object
        properties:
          index: { type: integer }
          code:
            type: string
            examples: [draft_reference, change_reason_required, entry_immutable, synthesis_incomplete, schema_invalid]
          message: { type: string }

# ---------- Bí mật provider ----------

ProviderSecretEnvelope:
  type: object
  description: |
    Ciphertext API key (envelope encryption, ADR-10). Chỉ agent-core và knowledge được gọi; chỉ hai service này có
    quyền KMS Decrypt. Không bao giờ chứa key dạng rõ; không ghi log.
  required: [connectionId, provider, baseUrl, ciphertext, nonce, wrappedDek, kekKeyId, aad]
  properties:
    connectionId: { $ref: ../components/schemas/common.yaml#/Id }
    provider: { $ref: ../components/schemas/common.yaml#/ProviderName }
    baseUrl: { type: string, format: uri }
    ciphertext: { type: string, contentEncoding: base64 }
    nonce: { type: string, contentEncoding: base64 }
    wrappedDek: { type: string, contentEncoding: base64 }
    kekKeyId: { type: string }
    aad: { type: string, description: accountId|connectionId }

# ---------- Tìm kiếm phân tán (WS-SEARCH, gateway fan-out) ----------

SearchHits:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        allOf:
          - $ref: ../components/schemas/project.yaml#/SearchResult
          - type: object
            properties:
              score: { type: number }

# ---------- Sự kiện và lệnh (AsyncAPI) ----------

EventEnvelope:
  type: object
  description: |
    Vỏ chung của mọi sự kiện trên exchange `sires.events`. `id` = id dòng outbox của service phát (ổn định, dùng cho
    inbox idempotent và `Last-Event-ID` của SSE). Routing key = `type`.
  required: [id, type, schemaVersion, producer, occurredAt, accountId, data]
  properties:
    id: { $ref: ../components/schemas/common.yaml#/Id }
    type: { type: string, examples: [task.activated] }
    schemaVersion: { type: integer, minimum: 1 }
    producer: { $ref: '#/ServiceName' }
    occurredAt: { $ref: ../components/schemas/common.yaml#/Timestamp }
    accountId: { $ref: ../components/schemas/common.yaml#/Id }
    projectId: { $ref: ../components/schemas/common.yaml#/Id }
    actor: { $ref: ../components/schemas/common.yaml#/ActorRef }
    aggregate:
      type: object
      description: Entity gốc và phiên bản sau thay đổi; consumer bỏ qua sự kiện có version nhỏ hơn bản đã xử lý.
      properties:
        type: { type: string }
        id: { $ref: ../components/schemas/common.yaml#/Id }
        version: { type: integer }
    traceparent: { type: string }
    data:
      type: object
      additionalProperties: true

StateChange:
  type: object
  description: Dữ liệu chung cho sự kiện đổi trạng thái (`fromState`/`toState` đúng chuỗi PRD 18.2).
  required: [objectType, objectId, toState]
  properties:
    objectType: { type: string }
    objectId: { $ref: ../components/schemas/common.yaml#/Id }
    fromState: { type: string }
    toState: { type: string }
    reasonCode: { $ref: ../components/schemas/common.yaml#/ReasonCode }

FileInput:
  type: object
  required: [path, url, sha256]
  properties:
    path: { type: string, description: Đường dẫn trong workspace build. }
    url: { type: string, format: uri, description: "Presigned URL đọc, hạn ngắn." }
    sha256: { type: string }

SandboxJob:
  type: object
  description: Lệnh `sandbox.build` (architecture 9). Sandbox không mạng; controller tải file theo `inputs` rồi chạy.
  required: [jobId, kind, accountId, inputs, limits]
  properties:
    jobId: { $ref: ../components/schemas/common.yaml#/Id }
    kind:
      type: string
      enum: [latex_build, mermaid_validate, mermaid_render]
    accountId: { $ref: ../components/schemas/common.yaml#/Id }
    projectId: { $ref: ../components/schemas/common.yaml#/Id }
    buildId: { $ref: ../components/schemas/common.yaml#/Id }
    compiler: { $ref: ../components/schemas/manuscript.yaml#/Compiler }
    mainFile: { type: string }
    mermaidSource: { type: string, description: Với mermaid_*; không dùng `inputs`. }
    inputs:
      type: array
      items: { $ref: '#/FileInput' }
    outputUploadUrls:
      type: object
      description: Presigned URL ghi cho log, PDF, SVG, PNG.
      additionalProperties: { type: string, format: uri }
    limits:
      type: object
      properties:
        timeoutSeconds: { type: integer, default: 120 }
        memoryMb: { type: integer, default: 2048 }
    resultCallback:
      type: string
      format: uri
      description: Với latex_build — endpoint nội bộ của manuscript nhận kết quả (manuscript.yaml).

SandboxResult:
  type: object
  required: [jobId, status]
  properties:
    jobId: { $ref: ../components/schemas/common.yaml#/Id }
    status:
      type: string
      enum: [succeeded, failed, timeout, memory_limit, syntax_error, render_error]
    durationMs: { type: integer }
    issues:
      type: array
      items: { $ref: ../components/schemas/manuscript.yaml#/BuildIssue }
    citationKeysFound:
      type: array
      items: { type: string }
    unresolvedKeys:
      type: array
      items: { type: string }
    outputs:
      type: object
      description: Khóa object storage đã ghi (log, pdf, svg, pdfFigure, png).
      additionalProperties: { type: string }
    imageVersion: { type: string, description: Phiên bản image TeX Live / mermaid-cli (tái lập kết quả). }
