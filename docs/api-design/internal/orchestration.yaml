openapi: 3.1.0
info:
  title: SIRes internal API — orchestration
  version: 0.1.0-mvp
  summary: API nội bộ của orchestration — vòng đời Agent Run với agent-core, Shared Context, prompt từ service khác.
  description: |
    orchestration giữ workflow engine (architecture mục 5): Workflow, WorkflowStep, AgentRun, Checkpoint,
    InteractiveAgentPrompt, ContextItem, Deliberation, DeliberationEntry, ContextSnapshot (DEC-47).
    agent-core nhận lệnh `agent.run` qua RabbitMQ (events/asyncapi.yaml) rồi gọi
    các endpoint dưới đây theo thứ tự: `start` → `heartbeat` (mỗi 30 s) → `result` hoặc `failure`.
    API công khai của workflow, prompt và Shared Context ở `paths/08-…` và `paths/14-…`.
  contact:
    name: eTroy — đội SWE, GEN AI, AIE và PO
  license:
    name: eTroy Non-Commercial License 1.0 (see LICENSES.md)
    identifier: LicenseRef-eTroy-NC-1.0
servers:
  - url: http://orchestration.sires.svc.cluster.local:8080
    description: Service nội bộ trong Kubernetes.
security:
  - serviceToken: []
tags:
  - name: Agent runs
    description: Bắt tay, heartbeat và kết quả Agent Run (architecture 5.2–5.8, F-07).
  - name: Shared context
    description: Context Item cho Context Assembler (CTX-STORE-001, lớp 3 và 7).
  - name: Prompts
    description: Prompt do service khác yêu cầu mở (8.4).
  - name: Deliberation board
    description: Deliberation Board và Context Snapshot do orchestration sở hữu (CTX-BOARD-001–003, CTX-SNAPSHOT-001).

paths:
  /internal/agent-runs/{agentRunId}/start:
    post:
      tags: [Agent runs]
      operationId: startAgentRun
      summary: Bắt tay khi agent-core nhận lệnh agent.run
      description: |
        Chỉ chấp nhận khi AgentRun còn Pending, là run hiện hành của bước và workflow Running (hoặc Created với run đầu tiên).
        Thành công: AgentRun → Running, bắt đầu theo dõi heartbeat, trả chi tiết công việc kèm token nội bộ có phạm vi agent.
        Message giao lại sau sự cố nhận `409` — agent-core ack và bỏ, không gọi provider (NFR-REC-002).
        Gọi lại `start` cho run đã Running bởi cùng `consumerId` trả lại cùng work order (idempotent).
      x-callers: [agent-core]
      x-requirements: [CTX-CONSISTENCY-001, CTX-ROUTING-001, NFR-REC-002]
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumerId]
              properties:
                consumerId: { type: string, description: Định danh pod/tác vụ agent-core đang giữ message. }
      responses:
        '200':
          description: Được phép chạy.
          content:
            application/json:
              schema: { $ref: schemas.yaml#/AgentRunWorkOrder }
        '401': { $ref: responses.yaml#/InvalidServiceToken }
        '403': { $ref: responses.yaml#/CallerNotAllowed }
        '404': { $ref: responses.yaml#/NotFound }
        '409': { $ref: responses.yaml#/StaleAgentRun }

  /internal/agent-runs/{agentRunId}/heartbeat:
    post:
      tags: [Agent runs]
      operationId: heartbeatAgentRun
      summary: Heartbeat 30 giây của Agent Run đang chạy
      description: |
        Cập nhật `workflow.heartbeatAt`. Không có heartbeat trong 110 s → sweeper chuyển Interrupted (CTX-RECOVERY-001).
        Phản hồi mang `cancelRequested` khi Researcher hủy workflow. `409` nghĩa là run đã bị coi là gián đoạn hoặc hủy —
        agent-core dừng ngay, không gửi kết quả.
      x-callers: [agent-core]
      x-requirements: [CTX-RECOVERY-001, NFR-REC-001, ORCH-FAILURE-001]
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                phase:
                  type: string
                  enum: [assembling_context, calling_model, running_tool, validating]
                  description: Dùng cho Agent Activity (OQ-033 — cập nhật theo sự kiện, không stream token).
                toolName: { type: string }
      responses:
        '200':
          description: Tiếp tục chạy.
          content:
            application/json:
              schema: { $ref: schemas.yaml#/AgentRunControl }
        '401': { $ref: responses.yaml#/InvalidServiceToken }
        '403': { $ref: responses.yaml#/CallerNotAllowed }
        '409': { $ref: responses.yaml#/StaleAgentRun }

  /internal/agent-runs/{agentRunId}/result:
    post:
      tags: [Agent runs]
      operationId: submitAgentRunResult
      summary: Gửi kết quả thành công của Agent Run
      description: |
        orchestration khóa hàng workflow, kiểm tra run hiện hành, lưu manifest/structured output/usage, rồi áp dụng
        từng `outputs[i]` vào service sở hữu (saga, idempotency key `agentRunId:i` — architecture 5.8). Trả `202` ngay sau
        khi lưu; agent-core ack message sau khi nhận `202`. Gửi lại cùng run trả `202` (idempotent).
        Run không còn hiện hành: lưu AgentRun với `discarded = true` và trả `409`.
        Đầu ra `deliberation_entry` ghi vào board của chính orchestration; đầu ra chính thức tham chiếu entry chưa `final`
        bị loại với `draft_reference` (CTX-BOARD-003). Entry draft của run chuyển `final` khi run Succeeded.
      x-callers: [agent-core]
      x-requirements: [CTX-REGISTRY-001, CTX-REGISTRY-002, CTX-CONSISTENCY-002, NFR-USAGE-001, NFR-OBS-006, INT-PROVIDER-006,
        CTX-BOARD-001, CTX-BOARD-003, NFR-USAGE-005]
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: schemas.yaml#/AgentRunResult }
      responses:
        '202':
          description: Đã nhận; đầu ra được áp dụng bất đồng bộ, theo dõi qua sự kiện `agent_run.status_changed`.
        '401': { $ref: responses.yaml#/InvalidServiceToken }
        '403': { $ref: responses.yaml#/CallerNotAllowed }
        '409': { $ref: responses.yaml#/StaleAgentRun }

  /internal/agent-runs/{agentRunId}/failure:
    post:
      tags: [Agent runs]
      operationId: submitAgentRunFailure
      summary: Báo Agent Run thất bại sau khi lớp adapter đã hết lượt thử lại
      description: |
        AgentRun → Failed với mã chuẩn (8.6). orchestration quyết định tạo Agent Run mới (tối đa 2, chỉ lỗi tạm thời)
        hoặc chuyển bước/workflow Failed (ORCH-FAILURE-001). Lỗi `auth_failed`/`quota_exceeded` do agent-core báo riêng
        cho identity (reportProviderIssue).
      x-callers: [agent-core]
      x-requirements: [ORCH-FAILURE-001, INT-PROVIDER-003, INT-PROVIDER-004]
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: schemas.yaml#/AgentRunFailure }
      responses:
        '202':
          description: Đã ghi nhận.
        '401': { $ref: responses.yaml#/InvalidServiceToken }
        '403': { $ref: responses.yaml#/CallerNotAllowed }
        '409': { $ref: responses.yaml#/StaleAgentRun }

  /internal/projects/{projectId}/context-items:
    get:
      tags: [Shared context]
      operationId: listContextItemsForAssembly
      summary: Context Item Active cho lắp ráp context (lớp 3 và tóm tắt cuốn chiếu lớp 7)
      description: |
        Trả Context Item phạm vi project và phạm vi các Task trong `agentScope.taskIds` của token (CTX-ISOLATION-001 điều 4).
        Item Superseded/Retracted không bao giờ trả.
      x-callers: [agent-core]
      x-requirements: [CTX-STORE-001, CTX-ASSEMBLY-001, CTX-ISOLATION-001]
      parameters:
        - $ref: ../components/parameters.yaml#/ProjectId
        - name: taskId
          in: query
          required: false
          schema: { $ref: ../components/schemas/common.yaml#/Id }
        - name: kinds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: ../components/schemas/orchestration.yaml#/ContextItemKind }
        - name: conversationId
          in: query
          required: false
          description: Khi có, trả thêm tóm tắt cuốn chiếu của hội thoại (lớp 7, OQ-064).
          schema: { $ref: ../components/schemas/common.yaml#/Id }
      responses:
        '200':
          description: Context dạng mục có tham chiếu.
          content:
            application/json:
              schema: { $ref: schemas.yaml#/ContextBundle }
        '401': { $ref: responses.yaml#/InvalidServiceToken }
        '403': { $ref: responses.yaml#/CallerNotAllowed }
        '404': { $ref: responses.yaml#/NotFound }

  /internal/projects/{projectId}/prompts:
    post:
      tags: [Prompts]
      operationId: openPromptOnBehalfOfService
      summary: Mở Interactive Agent Prompt do service khác yêu cầu
      description: |
        Dùng khi service hệ thống cần hỏi Researcher trong một workflow đang có: planning thiếu thông tin thiết yếu
        của Research Context (6.2), library mở prompt duyệt reference theo lô (DEC-21). Prompt gắn `objectVersion`;
        đối tượng đổi phiên bản thì prompt Cancelled (CTX-CONSISTENCY-003). Workflow chuyển Waiting for User.
      x-callers: [planning, library]
      x-requirements: [PROMPT-LIFECYCLE-001, PROMPT-APPROVAL-001, LIB-APPROVAL-001]
      parameters:
        - $ref: ../components/parameters.yaml#/ProjectId
        - $ref: ../components/parameters.yaml#/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflowId, type, question, pendingAction]
              properties:
                workflowId: { $ref: ../components/schemas/common.yaml#/Id }
                taskId: { $ref: ../components/schemas/common.yaml#/Id }
                type: { $ref: ../components/schemas/orchestration.yaml#/PromptType }
                question: { type: string }
                pendingAction:
                  type: object
                  required: [objectType, objectId, objectVersion]
                  properties:
                    apr: { $ref: ../components/schemas/common.yaml#/AprCode }
                    objectType: { type: string }
                    objectId: { $ref: ../components/schemas/common.yaml#/Id }
                    objectVersion: { type: integer }
                    approveEndpoint:
                      type: string
                      description: Endpoint nội bộ của service sở hữu mà orchestration gọi khi Researcher duyệt (F-08.3).
                choices:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      label: { type: string }
                      consequence: { type: string }
                      recommended: { type: boolean }
                editablePayload:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Prompt đã mở.
          content:
            application/json:
              schema: { $ref: ../components/schemas/orchestration.yaml#/InteractiveAgentPrompt }
        '401': { $ref: responses.yaml#/InvalidServiceToken }
        '403': { $ref: responses.yaml#/CallerNotAllowed }
        '404': { $ref: responses.yaml#/NotFound }
        '409': { $ref: responses.yaml#/Conflict }

  # ---- Deliberation Board và Context Snapshot (PRD 8.7, 14.9 — DEC-47; Assumption, ADR-24 (Proposed)) ----
  /internal/agent-runs/{agentRunId}/deliberations:
    post:
      tags: [Deliberation board]
      operationId: openDeliberation
      summary: Orchestrator mở phiên thảo luận bằng Problem Brief (Vòng 0)
      description: |
        Hợp đồng duy nhất để mở phiên (ORCH-DELIB-001). Agent Run gọi phải là của `orchestrator` và thuộc Workflow Step loại
        deliberation chưa có phiên (`WorkflowStep.deliberationId = null`) — bước do StepPlan lập, hoặc bước đầu của workflow
        `deliberation` khi Researcher yêu cầu từ chat. Trong một giao dịch orchestration:
        (1) kiểm tra Problem Brief đủ trường và `problemType` thuộc danh sách 8.7; (2) kiểm tra Researcher đã chọn
        `deliberate` ở prompt `deliberation_proposal` (`proposalPromptId`), trừ bước phân tích của workflow `plan_proposal`
        (OQ-099); (3) kiểm tra hai instance Analysis Agent có Agent Model Assignment hợp lệ, ghi cấu hình model vào
        `participants` và tính `sameModelWarning` (ORCH-DELIB-005); (4) tạo Deliberation `Running` (`currentRound = 0`),
        Context Snapshot bất biến từ `contextRefs` của brief và các entity dùng chung trong phạm vi đọc của các bên
        (CTX-SNAPSHOT-001), entry `problem_brief` `final` làm entry đầu tiên trên board; gắn `deliberationId` vào bước;
        ghi Audit Event; phát `deliberation.started` qua outbox. Agent Run Vòng 1 chỉ được giao sau khi giao dịch commit
        (ORCH-DELIB-001-AC01).
        Lỗi nghiệp vụ trả `422`: `problem_type_not_allowed` (vấn đề thuộc nhóm không thảo luận), `schema_invalid` (brief
        thiếu trường), `analysis_agent_not_configured` (Analysis Agent thiếu cấu hình hợp lệ — không mở phiên; Orchestrator
        tạo prompt `deliberation_proposal` để Researcher cấu hình lại hoặc tiếp tục không thảo luận),
        `deliberation_not_confirmed` (thiếu xác nhận của Researcher). Gọi lại cùng `Idempotency-Key` trả lại phiên đã tạo.
        Entry `problem_brief` không ghi được qua `writeDeliberationEntry` hay đầu ra `deliberation_entry`.
      x-callers: [agent-core]
      x-requirements: [ORCH-DELIB-001, ORCH-DELIB-005, CTX-SNAPSHOT-001, CTX-BOARD-001, AGENT-ANALYSIS-001]
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
        - $ref: ../components/parameters.yaml#/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief]
              properties:
                brief: { $ref: ../components/schemas/orchestration.yaml#/ProblemBrief }
                proposalPromptId:
                  type: [string, 'null']
                  format: uuid
                  description: Prompt `deliberation_proposal` đã được trả lời `deliberate`; `null` với bước phân tích của 6.3.
      responses:
        '201':
          description: Phiên đã mở; kèm Context Snapshot vừa tạo.
          content:
            application/json:
              schema:
                type: object
                required: [deliberation, contextSnapshot, problemBriefEntryId]
                properties:
                  deliberation: { $ref: ../components/schemas/orchestration.yaml#/Deliberation }
                  contextSnapshot: { $ref: ../components/schemas/orchestration.yaml#/ContextSnapshot }
                  problemBriefEntryId: { $ref: ../components/schemas/common.yaml#/Id }
        '401': { $ref: responses.yaml#/InvalidServiceToken }
        '403': { $ref: responses.yaml#/CallerNotAllowed }
        '409': { $ref: responses.yaml#/StaleAgentRun }
        '422': { $ref: responses.yaml#/UnprocessableEntity }

  /internal/workflows/{workflowId}/board:
    get:
      tags: [Deliberation board]
      operationId: readDeliberationBoard
      summary: Đọc Deliberation Board cho Agent Run (lọc theo quyền xem theo vòng)
      description: |
        Công cụ đọc board của agent và nguồn entry cho Context Assembler. orchestration lấy `agentRunId` từ token nội bộ
        và chỉ trả entry bên gọi được xem (CTX-BOARD-002): trong Vòng 1, position của bên khác bị ẩn tới khi vòng đóng;
        từ Vòng 2, entry của vòng đã đóng và entry `final` của vòng hiện tại. Entry yêu cầu theo `entryIds` mà đang bị ẩn
        không được trả (kết quả rỗng cho entry đó) và orchestration ghi Audit Event truy cập bị từ chối.
        Finding của bước song song (CTX-BOARD-003) đọc được cả khi còn `draft` — agent chỉ dùng để định hướng.
        Context manifest ghi entry đã dùng dưới dạng `TypedRef` loại `deliberation_entry`.
      x-callers: [agent-core]
      x-requirements: [CTX-BOARD-001, CTX-BOARD-002, CTX-BOARD-003, AGENT-ANALYSIS-001]
      parameters:
        - $ref: ../components/parameters.yaml#/WorkflowId
        - name: deliberationId
          in: query
          schema: { $ref: ../components/schemas/common.yaml#/Id }
        - name: types
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: ../components/schemas/orchestration.yaml#/DeliberationEntryType }
        - name: entryIds
          in: query
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { $ref: ../components/schemas/common.yaml#/Id }
        - name: since
          in: query
          description: Chỉ entry tạo sau thời điểm này (đọc tiếp sau sự kiện `deliberation.entry_added`).
          schema: { $ref: ../components/schemas/common.yaml#/Timestamp }
      responses:
        '200':
          description: Entry bên gọi được xem.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  deliberation:
                    type: object
                    properties:
                      deliberationId: { $ref: ../components/schemas/common.yaml#/Id }
                      currentRound: { type: integer }
                      status: { $ref: ../components/schemas/orchestration.yaml#/DeliberationStatus }
                  entries:
                    type: array
                    items: { $ref: ../components/schemas/orchestration.yaml#/DeliberationEntry }
        '401': { $ref: responses.yaml#/InvalidServiceToken }
        '403': { $ref: responses.yaml#/CallerNotAllowed }
        '404': { $ref: responses.yaml#/NotFound }

  /internal/agent-runs/{agentRunId}/deliberation-entries:
    post:
      tags: [Deliberation board]
      operationId: writeDeliberationEntry
      summary: Ghi entry lên board trong lúc Agent Run đang chạy
      description: |
        Dùng khi entry cần hiện trước khi Agent Run kết thúc — chủ yếu finding draft của bước song song (CTX-BOARD-003).
        Entry còn lại ghi qua `outputs` loại `deliberation_entry` của `submitAgentRunResult`. orchestration đặt `author`,
        `round`, `status`, gắn `assumption` cho điểm thiếu nguồn, kiểm tra schema và quyền; ghi bền vững rồi phát
        `deliberation.entry_added`. Chỉ ghi thêm; không có thao tác sửa. `deliberationId` theo quy tắc ở
        `DeliberationEntryWrite`; `problem_brief` chỉ ghi qua `openDeliberation`. Lỗi nghiệp vụ trả `422` với `code`:
        `change_reason_required`, `synthesis_incomplete`, `deliberation_mismatch`, `schema_invalid`.
      x-callers: [agent-core]
      x-requirements: [CTX-BOARD-001, CTX-BOARD-003, ORCH-DELIB-003, AGENT-SCOPE-001]
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
        - $ref: ../components/parameters.yaml#/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../components/schemas/orchestration.yaml#/DeliberationEntryWrite }
      responses:
        '201':
          description: Entry đã ghi.
          content:
            application/json:
              schema: { $ref: ../components/schemas/orchestration.yaml#/DeliberationEntry }
        '401': { $ref: responses.yaml#/InvalidServiceToken }
        '403': { $ref: responses.yaml#/CallerNotAllowed }
        '409': { $ref: responses.yaml#/StaleAgentRun }
        '422': { $ref: responses.yaml#/UnprocessableEntity }

  /internal/agent-runs/{agentRunId}/deliberation-entries/{entryId}/finalize:
    post:
      tags: [Deliberation board]
      operationId: finalizeDeliberationEntry
      summary: Tác giả xác nhận entry draft (draft → final)
      description: |
        Chỉ Agent Run tác giả gọi được. Entry draft chưa xác nhận chuyển `final` khi Agent Run Succeeded; khi Agent Run
        Failed/Cancelled entry giữ `draft` và không tính là entry final của vòng (Assumption). Gọi lại trả cùng kết quả.
        Mỗi lần draft → final (qua endpoint này hoặc khi Agent Run Succeeded) phát `deliberation.entry_finalized`.
      x-callers: [agent-core]
      x-requirements: [CTX-BOARD-001, CTX-BOARD-003]
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
        - name: entryId
          in: path
          required: true
          schema: { $ref: ../components/schemas/common.yaml#/Id }
      responses:
        '200':
          description: Entry final.
          content:
            application/json:
              schema: { $ref: ../components/schemas/orchestration.yaml#/DeliberationEntry }
        '401': { $ref: responses.yaml#/InvalidServiceToken }
        '403': { $ref: responses.yaml#/CallerNotAllowed }
        '404': { $ref: responses.yaml#/NotFound }
        '409': { $ref: responses.yaml#/Conflict }

  /internal/deliberations/{deliberationId}/context-snapshot:
    get:
      tags: [Deliberation board]
      operationId: getContextSnapshotForAssembly
      summary: Context Snapshot của phiên để lắp ráp context
      description: |
        Context Assembler của agent-core lấy danh sách tham chiếu có phiên bản rồi đọc nội dung từ service sở hữu đúng phiên
        bản đó, trong phạm vi đọc của agent (CTX-SNAPSHOT-001, AGENT-ANALYSIS-001-AC03). Snapshot lỗi thời vẫn được dùng
        tới hết phiên.
      x-callers: [agent-core]
      x-requirements: [CTX-SNAPSHOT-001, CTX-ASSEMBLY-001, CTX-ISOLATION-001]
      parameters:
        - $ref: ../components/parameters.yaml#/DeliberationId
      responses:
        '200':
          description: Snapshot.
          content:
            application/json:
              schema: { $ref: ../components/schemas/orchestration.yaml#/ContextSnapshot }
        '401': { $ref: responses.yaml#/InvalidServiceToken }
        '403': { $ref: responses.yaml#/CallerNotAllowed }
        '404': { $ref: responses.yaml#/NotFound }

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
