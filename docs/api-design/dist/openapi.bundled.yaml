            review:
              type: object
              properties:
                decision:
                  type: string
                by:
                  $ref: '#/components/schemas/ActorRef'
                at:
                  $ref: '#/components/schemas/Timestamp'
                note:
                  type: string
            approval:
              $ref: '#/components/schemas/ApprovalRecord'
    ArtifactVersionCreate:
      type: object
      description: Researcher sửa nội dung — tạo version Draft mới, không sửa tại chỗ.
      required:
        - basedOnVersionId
      properties:
        basedOnVersionId:
          $ref: '#/components/schemas/Id'
        content:
          type: string
        fileUploadId:
          $ref: '#/components/schemas/Id'
        note:
          type: string
    ArtifactDecision:
      type: object
      description: |
        Chấp nhận/từ chối version. APR theo loại: APR-03 (đầu ra Task), APR-06 (synthesis), APR-07 (diagram).
        Chấp nhận synthesis yêu cầu mọi claim liên kết đã được quyết định (SYN-HUMAN-REVIEW-001).
      properties:
        note:
          type: string
    AuditEvent:
      type: object
      readOnly: true
      description: Chỉ ghi thêm (CTX-AUDIT-001). Không bao giờ chứa API key.
      required:
        - id
        - accountId
        - actor
        - action
        - objectType
        - objectId
        - at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        accountId:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
        actor:
          $ref: '#/components/schemas/ActorRef'
        action:
          type: string
          examples:
            - reference.revoked
            - task.activated
            - plan_version.approved
        objectType:
          type: string
        objectId:
          $ref: '#/components/schemas/Id'
        objectVersion:
          type: integer
        fromState:
          type: string
        toState:
          type: string
        apr:
          $ref: '#/components/schemas/AprCode'
        summary:
          type: string
        correlationId:
          type: string
        at:
          $ref: '#/components/schemas/Timestamp'
  responses:
    ServiceUnavailable:
      description: Dịch vụ ngoài không khả dụng (eTroy OIDC, dịch vụ trung gian Scholar, provider) — INT-OIDC-004, 17.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoContent:
      description: Thành công, không có nội dung.
    Unauthorized:
      description: Chưa đăng nhập hoặc phiên eTroy OIDC đã hết hạn (INT-OIDC-003). Client chuyển tới `GET /auth/login`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Dữ liệu không hợp lệ (DATA-VALID-001) — trường bắt buộc thiếu, enum sai, vượt giới hạn.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://sires.etroy.local/problems/validation_failed
            title: Dữ liệu không hợp lệ
            status: 400
            code: validation_failed
            errors:
              - field: researchQuestion
                code: required
    PreconditionFailed:
      description: '`If-Match` không khớp rowVersion hiện hành — tải lại rồi thử lại (DATA-CONC-001).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        Xung đột trạng thái. `code` một trong: `invalid_transition` (DATA-STATE-001), `action_not_allowed_in_state`
        (DATA-STATE-002), `project_archived`, `active_workflow_exists` (DATA-IDEMP-002), `readiness_failed`,
        `open_plan_version_exists`, `base_revision_mismatch`, `citation_check_failed`, `connection_in_use`,
        `duplicate_name`, `restore_window_expired`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://sires.etroy.local/problems/invalid_transition
            title: Chuyển trạng thái không hợp lệ
            status: 409
            code: invalid_transition
            detail: Task đang Ready, không thể chuyển thẳng sang Completed.
            currentState: Ready
    NotFound:
      description: |
        Không tồn tại, hoặc thuộc tài khoản/project khác (NFR-ISOL, OWN-03) — hai trường hợp không phân biệt.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: |
        Yêu cầu đúng cú pháp nhưng vi phạm quy tắc nghiệp vụ, ví dụ `idempotency_key_reused`, `dependency_cycle`,
        `reference_not_trusted`, `pdf_without_text_layer`, `model_not_available`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkflowAccepted:
      description: Đã nhận yêu cầu; Workflow được tạo (Created/Running). Theo dõi qua `Location` hoặc `GET /events`.
      headers:
        Location:
          description: URL của Workflow.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Workflow'
    PayloadTooLarge:
      description: File vượt giới hạn (PDF ≤ 50 MB — INT-DOC-001). Không cắt ngầm.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token chống CSRF lấy từ `GET /auth/session`, bắt buộc cho mọi lệnh ghi dùng cookie phiên.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Giá trị `ETag` (= rowVersion) đã đọc trước đó. Lệch phiên bản trả `412` (DATA-CONC-001).
      schema:
        type: string
        examples:
          - '"7"'
    ProjectIdFilter:
      name: projectId
      in: query
      required: false
      description: Lọc theo project; bỏ trống để lấy mọi project của tài khoản (Global Workspace).
      schema:
        $ref: '#/components/schemas/Id'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Giá trị `nextCursor` của trang trước.
      schema:
        type: string
    PromptId:
      name: promptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Khóa do client tạo (UUID khuyến nghị) cho lệnh có tác động (DATA-IDEMP-001).
        Gửi lại cùng khóa trả về kết quả lần đầu; cùng khóa với nội dung khác trả `422 idempotency_key_reused`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PlanVersionId:
      name: planVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReferenceId:
      name: referenceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    BuildId:
      name: buildId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
