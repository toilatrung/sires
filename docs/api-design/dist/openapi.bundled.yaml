  /events:
    get:
      tags:
        - Events
      operationId: streamEvents
      summary: Luồng sự kiện realtime (Server-Sent Events)
      description: |
        Phát sau khi giao dịch commit (outbox, DATA-PERSIST-001) để giao diện cập nhật Agent Activity, prompt, Task,
        build, indexing. Kết nối lại với `Last-Event-ID` để nhận sự kiện bị lỡ; nếu quá xa, client tải lại trạng thái bằng
        các endpoint GET. Sự kiện chỉ thuộc tài khoản của phiên.
      x-requirements:
        - UX-MONITOR-001
        - UX-STATE-001
        - DATA-PERSIST-001
      x-priority: P0
      x-milestone: M2
      parameters:
        - $ref: '#/components/parameters/ProjectIdFilter'
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        '200':
          description: |
            Luồng `text/event-stream`; mỗi bản ghi có `id`, `event` (= Event.type) và `data` (JSON của Event).
          content:
            text/event-stream:
              schema:
                type: string
              x-event-schema:
                type: object
                description: |
                  Sự kiện phát qua SSE sau khi giao dịch commit (outbox — DATA-PERSIST-001). `id` dùng cho `Last-Event-ID` khi kết nối lại.
                required:
                  - id
                  - type
                  - at
                properties:
                  id:
                    type: string
                  type:
                    type: string
                    examples:
                      - workflow.status_changed
                      - agent_run.status_changed
                      - prompt.created
                      - prompt.status_changed
                      - task.status_changed
                      - message.created
                      - pending_action.created
                      - notification.created
                      - reference.indexing_status_changed
                      - build.status_changed
                      - change_proposal.status_changed
                  projectId:
                    $ref: common.yaml#/Id
                  objectType:
                    type: string
                  objectId:
                    $ref: common.yaml#/Id
                  fromState:
                    type: string
                  toState:
                    type: string
                  at:
                    $ref: common.yaml#/Timestamp
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sires_session
      description: |
        Cookie phiên do SIRes cấp sau khi hoàn tất luồng authorization code với eTroy OIDC (INT-OIDC-001, INT-OIDC-003).
        Phiên hết hạn cùng token eTroy nếu không làm mới được. SIRes không có đăng nhập bằng mật khẩu.
    etroyOidc:
      type: openIdConnect
      openIdConnectUrl: https://oidc.etroy.local/.well-known/openid-configuration
      description: |
        eTroy OIDC (github.com/toilatrung/eTroy_OIDC) — chỉ dùng giữa backend SIRes (Relying Party) và eTroy;
        client giao diện không giữ token. URL discovery là placeholder, chốt khi tích hợp (ASM-13).
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details với `code` ổn định để client dịch thông báo (UX-I18N).
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          examples:
            - validation_failed
            - invalid_transition
            - action_not_allowed_in_state
            - readiness_failed
        detail:
          type: string
        instance:
          type: string
        currentState:
          type: string
          description: Trạng thái hiện hành khi lỗi là chuyển trạng thái.
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
        suggestedAction:
          type: string
          description: Gợi ý xử lý (ví dụ “Mở Settings › Agent Models”, RC-08).
        correlationId:
          type: string
    Id:
      type: string
      format: uuid
      description: Định danh UUID, không đoán được, không mang ý nghĩa (18.1).
    Timestamp:
      type: string
      format: date-time
    AgentName:
      type: string
      description: Orchestrator và bảy Specialist Agent cố định trong MVP (SCOPE-14).
      enum:
        - orchestrator
        - discovery
        - reference_processing
        - evidence_retrieval
        - synthesis
        - writing
        - verification
        - diagram
    ActorRef:
      type: object
      description: Actor của mọi thay đổi (OQ-004). `agentRunId` bắt buộc khi `type = agent`.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - researcher
            - agent
            - system
        accountId:
          $ref: '#/components/schemas/Id'
        agent:
          $ref: '#/components/schemas/AgentName'
        agentRunId:
          $ref: '#/components/schemas/Id'
        component:
          type: string
          description: Thành phần hệ thống khi `type = system` (ví dụ readiness, indexer, recovery).
    EntityMeta:
      type: object
      description: Trường chung của mọi entity (18.1).
      required:
        - id
        - accountId
        - createdAt
        - createdBy
        - rowVersion
      properties:
        id:
          $ref: '#/components/schemas/Id'
        accountId:
          $ref: '#/components/schemas/Id'
        projectId:
          $ref: '#/components/schemas/Id'
          description: Bắt buộc với entity cấp project.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          $ref: '#/components/schemas/ActorRef'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedBy:
          $ref: '#/components/schemas/ActorRef'
        rowVersion:
          type: integer
          description: Optimistic concurrency; trả kèm header `ETag`.
        deletedAt:
          $ref: '#/components/schemas/Timestamp'
      readOnly: true
    Profile:
      type: object
      description: Thông tin cá nhân (15.12, DEC-24). Sửa thuộc APR-09.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: Ban đầu lấy từ claim OIDC, người dùng sửa được (ASM-13).
        email:
          type: string
          format: email
          readOnly: true
          description: Lấy từ claim OIDC.
        affiliation:
          type: string
          maxLength: 300
        researchField:
          type: string
          maxLength: 300
        avatarUrl:
          type: string
          format: uri
          readOnly: true
        googleScholarProfileUrl:
          type: string
          format: uri
          pattern: ^https://
          description: Chỉ là liên kết, không phải đăng nhập Google (ASM-14).
    Language:
      type: string
      enum:
        - vi
        - en
    Preferences:
      type: object
      properties:
        uiLanguage:
          $ref: '#/components/schemas/Language'
        defaultAgentLanguage:
          $ref: '#/components/schemas/Language'
        includeResearchFieldInContext:
          type: boolean
          default: false
          description: Bật thì chỉ `researchField` được đưa vào context agent (OQ-015).
        timezone:
          type: string
          examples:
            - Asia/Saigon
        debugMode:
          type: boolean
          default: false
          description: Bật thì lưu toàn văn prompt/phản hồi model 30 ngày (OQ-062, CTX-REGISTRY-002).
    Account:
      allOf:
        - $ref: '#/components/schemas/EntityMeta'
        - type: object
          required:
            - authIdentity
            - profile
            - preferences
          properties:
            authIdentity:
              type: object
              readOnly: true
              description: Cặp (issuer, subject) duy nhất toàn hệ thống (INT-OIDC-002). Không có trường mật khẩu.
              required:
                - issuer
                - subject
              properties:
                issuer:
                  type: string
                  format: uri
                subject:
                  type: string
            profile:
              $ref: '#/components/schemas/Profile'
            preferences:
              $ref: '#/components/schemas/Preferences'
            setup:
              type: object
              readOnly: true
              description: Trạng thái thiết lập ban đầu — tài khoản mới chưa có Provider Connection Valid.
              properties:
                hasValidProviderConnection:
                  type: boolean
                hasEmbeddingSettings:
                  type: boolean
    VerificationThresholds:
      type: object
      description: |
        “Ngưỡng kiểm chứng” (OQ-092, ASM-15). Giá trị mặc định do hệ thống hiệu chỉnh để đạt ≥ 85% (mức hỗ trợ claim)
        và ≥ 95% (phát hiện citation không khớp). Thay đổi áp dụng từ lần kiểm chứng sau và ghi AuditEvent.
      required:
        - claimSupport
        - citationMismatch
        - isDefault
      properties:
        claimSupport:
          type: object
          description: Ngưỡng điểm để gán mức hỗ trợ claim.
          properties:
            supported:
              type: number
              minimum: 0
              maximum: 1
            partiallySupported:
              type: number
              minimum: 0
              maximum: 1
        citationMismatch:
          type: object
          properties:
            mismatch:
              type: number
              minimum: 0
              maximum: 1
        isDefault:
          type: boolean
          readOnly: true
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedBy:
          $ref: '#/components/schemas/ActorRef'
    ProviderName:
      type: string
      description: MVP chỉ ba provider (OQ-014, DEC-20).
      enum:
        - anthropic
        - openai
        - google
    ConnectionTestStatus:
      type: string
      enum:
        - Untested
        - Valid
        - Invalid
    ProviderErrorCode:
      type: string
      description: |
        Bộ mã lỗi chuẩn hóa (8.6). Tạm thời (tự thử lại trong Agent Run): rate_limited, timeout, provider_unavailable,
        network_error. `interrupted` là mã hệ thống (14.7), đi qua Recovery decision.
      enum:
        - auth_failed
        - permission_denied
        - model_not_found
        - rate_limited
        - quota_exceeded
