    TaskReviewCreate:
      type: object
      description: |
        Nghiệm thu (APR-03, T-14), trả lại (T-13) hoặc chặn (T-15). `reasonCode` bắt buộc khi returned/blocked (KPI-04).
        Nghiệm thu yêu cầu mọi acceptance criterion đạt và đầu ra bắt buộc có version Accepted.
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum:
            - accepted
            - returned
            - blocked
        criteriaResults:
          type: array
          items:
            type: object
            required:
              - criterionId
              - met
            properties:
              criterionId:
                type: string
              met:
                type: boolean
        feedback:
          type: string
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
      allOf:
        - if:
            properties:
              outcome:
                enum:
                  - returned
                  - blocked
          then:
            required:
              - reasonCode
              - feedback
            properties:
              reasonCode:
                $ref: '#/components/schemas/ReasonCode'
              feedback:
                type: string
                minLength: 1
