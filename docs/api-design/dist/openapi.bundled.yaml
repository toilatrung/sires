openapi: 3.1.0
info:
  title: SIRes API (MVP)
  version: 0.1.0-mvp
  summary: REST API cho SIRes (Super Intelligence Researcher) — phạm vi MVP M1–M7.
  description: |
    Đặc tả API mức MVP, suy ra từ PRD SIRes v1.0 (PO duyệt qua phiếu chốt PC-01, 31/10/2026).
    Mỗi file trong `paths/` tương ứng một mục của PRD (`docs/overview/sections/NN-slug.html`);
    schema trong `components/schemas/` lấy từ mục 5 (Core Domain Model) và mục 18 (Data and State Specifications).

    **Trạng thái:** Assumption — bản đề xuất của biên soạn, chưa phải quyết định kiến trúc.
    Technology stack chưa chọn (DEC-27, OQ-091); API không giả định framework cụ thể.

    ## Quy ước chung
    - **Xác thực:** duy nhất qua eTroy OIDC (INT-OIDC-001–004). Backend SIRes là OIDC Relying Party,
      giữ token phía server và cấp cookie phiên `sires_session` (HttpOnly, Secure, SameSite=Lax).
      Lệnh ghi (POST/PUT/PATCH/DELETE) gửi kèm header `X-CSRF-Token`.
    - **Ownership:** mọi tài nguyên thuộc tài khoản của phiên; tài nguyên của tài khoản khác trả `404`
      (không tiết lộ sự tồn tại — OWN-03, NFR-ISOL). Tài nguyên cấp project nằm dưới `/projects/{projectId}`.
    - **Idempotency:** lệnh có tác động (kích hoạt Task, duyệt, trả lời prompt, chấp nhận proposal,
      gửi kết quả manual, tạo project…) bắt buộc header `Idempotency-Key` (DATA-IDEMP-001).
      Gửi lại cùng khóa trả về kết quả lần đầu.
    - **Concurrency:** entity sửa được trả `ETag` = `rowVersion`; PATCH/PUT bắt buộc `If-Match`.
      Lệch phiên bản trả `412` (DATA-CONC-001).
    - **Chuyển trạng thái:** mỗi chuyển trạng thái là một endpoint hành động (`POST …/approve`, `…/activate`).
      Chuyển không có trong bảng 18.2 trả `409` với `code = invalid_transition` (DATA-STATE-001);
      hành động bị chặn theo quyền theo trạng thái trả `409` `code = action_not_allowed_in_state` (DATA-STATE-002).
    - **Phê duyệt (APR-01–APR-10):** chỉ Researcher thực hiện qua phiên người dùng. Agent không bao giờ gọi các
      endpoint này (REL-04); mọi phê duyệt sinh `ApprovalRecord` và `AuditEvent`.
    - **Tác vụ dài:** endpoint khởi chạy agent trả `202 Accepted` cùng `Workflow`; tiến trình theo dõi qua
      `GET /workflows/{workflowId}` hoặc luồng sự kiện `GET /events` (Server-Sent Events).
    - **Lỗi:** `application/problem+json` (RFC 9457) với trường `code` ổn định.
    - **Phân trang:** cursor — `?limit=&cursor=`; phản hồi có `nextCursor`.
    - **Bí mật:** API key chỉ được gửi vào (write-only), không bao giờ trả ra; chỉ có `keyHint` (REL-07).

    Mục lục và bảng truy vết: `docs/api/index.html`. Quy ước biên soạn: `docs/api/README.md`.
  contact:
    name: eTroy — đội SWE, GEN AI, AIE và PO
  license:
    name: eTroy Non-Commercial License 1.0 (see LICENSES.md)
    identifier: LicenseRef-eTroy-NC-1.0
servers:
  - url: https://{host}/api/v1
    description: Môi trường cloud do đội phát triển vận hành (DEC-27); host chốt khi chọn hạ tầng.
    variables:
      host:
        default: sires.etroy.local
  - url: http://localhost:8080/api/v1
    description: Phát triển cục bộ
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: Đăng nhập qua eTroy OIDC — PRD 17.7, 15.12 (M1).
  - name: Account & Settings
    description: Profile, Preferences, Ngưỡng kiểm chứng — PRD 15.12, 18.1 (M1).
  - name: Provider Connections
    description: Kết nối Claude, OpenAI, Gemini do người dùng cấp key — PRD 8.6, SCOPE-13 (M1).
  - name: Agent Models
    description: Gán model cho Orchestrator và 7 Specialist Agent — PRD 8.6, 8.2 (M1).
  - name: Workspace
    description: Dashboard, tìm kiếm, Pending Actions, Notifications — PRD 4.4, 7 (M2).
  - name: Projects
    description: Research Project và Research Context có phiên bản — PRD 7 (M2).
  - name: Conversations
    description: Global AI Assistant và Project AI Chat — PRD 7, 8.1 (M2).
  - name: Prompts
    description: Interactive Agent Prompt — PRD 8.4, 5.9 (M2).
  - name: Plan
    description: Research Plan và Plan Version — PRD 9.1–9.3, 9.11 (M3).
  - name: Tasks
    description: Task, readiness, kích hoạt, nghiệm thu — PRD 9.4–9.10 (M3).
  - name: Discovery
    description: Google Scholar qua dịch vụ trung gian, nguồn dự phòng — PRD 10.1–10.3, 17.2 (M4).
  - name: Trusted Library
    description: Reference, duyệt, thu hồi, nội dung để index — PRD 10.4–10.9 (M4).
  - name: Evidence & Claims
    description: Indexing, RAG evidence, claim, kiểm chứng — PRD 11 (M4–M5).
  - name: Artifacts
    description: Artifact và Artifact Version có provenance — PRD 5.7, 14.4 (M2–M5).
  - name: Manuscript
    description: LaTeX workspace, Change Proposal, bibliography, build — PRD 12 (M6).
  - name: Diagrams
    description: Diagram Agent, Mermaid — PRD 13 (M6).
  - name: Orchestration
    description: Workflow, Agent Run, khôi phục — PRD 8.5, 14.6–14.7 (M2, M7).
  - name: Shared Context
    description: Context Item và khung nhìn Shared Context — PRD 14.1–14.3 (M2).
  - name: Audit
    description: Audit trail chỉ ghi thêm và export — PRD 14.8 (M1, M7).
  - name: Events
    description: Luồng sự kiện realtime cho giao diện — PRD 15.8, DATA-PERSIST-001 (M2).
paths:
  /auth/login:
    get:
      tags:
        - Auth
      operationId: startLogin
      summary: Bắt đầu đăng nhập qua eTroy OIDC
      description: |
        Chuyển hướng tới eTroy OIDC theo luồng authorization code (có state, nonce, PKCE).
        Không có phương thức đăng nhập khác (NFR-AUTH-001).
      x-requirements:
        - INT-OIDC-001
      x-priority: P0
      x-milestone: M1
      security: []
      parameters:
        - name: returnTo
          in: query
          description: Đường dẫn nội bộ quay lại sau khi đăng nhập (chỉ nhận đường dẫn tương đối).
          schema:
            type: string
            pattern: ^/
      responses:
        '302':
          description: Chuyển tới endpoint authorize của eTroy OIDC.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/callback:
    get:
      tags:
        - Auth
      operationId: completeLogin
      summary: Callback của eTroy OIDC
      description: |
        Kiểm tra state, nonce, chữ ký, issuer, audience, thời hạn ID token rồi tạo phiên (INT-OIDC-001).
        Lần đầu với một `sub` mới tạo tài khoản SIRes (họ tên, email từ claim); các lần sau dùng lại (INT-OIDC-002).
      x-requirements:
        - INT-OIDC-001
        - INT-OIDC-002
      x-priority: P0
      x-milestone: M1
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Thành công — đặt cookie `sires_session` và chuyển về `returnTo`. Thất bại — chuyển về trang đăng nhập kèm mã lỗi.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Đăng xuất
      description: Kết thúc phiên SIRes và thu hồi token phía server (INT-OIDC-003).
      x-requirements:
        - INT-OIDC-003
      x-priority: P0
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/session:
    get:
      tags:
        - Auth
      operationId: getSession
      summary: Trạng thái phiên hiện tại
      description: Trả thông tin phiên và CSRF token. Không bao giờ trả access/ID token.
      x-requirements:
        - INT-OIDC-003
      x-priority: P0
      x-milestone: M1
      responses:
        '200':
          description: Phiên hợp lệ.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accountId
                  - expiresAt
                  - csrfToken
                properties:
                  accountId:
                    $ref: '#/components/schemas/Id'
                  expiresAt:
                    $ref: '#/components/schemas/Timestamp'
                  csrfToken:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags:
        - Account & Settings
      operationId: getMe
      summary: Tài khoản, Profile và Preferences
      x-requirements:
        - INT-OIDC-002
        - UX-I18N-001
      x-priority: P0
      x-milestone: M1
      responses:
        '200':
          description: Tài khoản hiện tại.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/profile:
    patch:
      tags:
        - Account & Settings
      operationId: updateProfile
      summary: Sửa thông tin cá nhân (APR-09)
      x-requirements:
        - UX-SETTINGS-001
      x-apr: APR-09
      x-priority: P0
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: Đã cập nhật; ghi AuditEvent.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /me/preferences:
    patch:
      tags:
        - Account & Settings
      operationId: updatePreferences
      summary: Sửa ngôn ngữ, công tắc đưa lĩnh vực nghiên cứu vào context, chế độ debug
      x-requirements:
        - UX-I18N-001
        - CTX-ASSEMBLY-001
        - CTX-REGISTRY-002
      x-apr: APR-09
      x-priority: P0
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Đã cập nhật.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /me/verification-thresholds:
    get:
      tags:
        - Account & Settings
      operationId: getVerificationThresholds
      summary: Xem Ngưỡng kiểm chứng
      x-requirements:
        - CLAIM-SUPPORT-001
        - CLAIM-CITATION-001
      x-priority: P0
      x-milestone: M5
      responses:
        '200':
          description: Bộ ngưỡng hiện hành của tài khoản.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationThresholds'
    put:
      tags:
        - Account & Settings
      operationId: updateVerificationThresholds
      summary: Sửa Ngưỡng kiểm chứng (APR-09)
      description: Áp dụng từ lần kiểm chứng sau; giá trị phải nằm trong miền hợp lệ do hệ thống quy định (18.5).
      x-requirements:
        - CLAIM-SUPPORT-001
      x-apr: APR-09
      x-priority: P0
      x-milestone: M5
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationThresholds'
      responses:
        '200':
          description: Đã cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationThresholds'
        '400':
          $ref: '#/components/responses/BadRequest'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /me/verification-thresholds/reset:
    post:
      tags:
        - Account & Settings
      operationId: resetVerificationThresholds
      summary: Khôi phục Ngưỡng kiểm chứng mặc định
      x-requirements:
        - CLAIM-SUPPORT-001
      x-apr: APR-09
      x-priority: P0
      x-milestone: M5
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Đã khôi phục mặc định (85% / 95%).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationThresholds'
  /provider-connections:
    get:
      tags:
        - Provider Connections
      operationId: listProviderConnections
      summary: Danh sách Provider Connection
      x-requirements:
        - AGENT-PROVIDER-002
      x-priority: P0
      x-milestone: M1
      responses:
        '200':
          description: Mọi kết nối của tài khoản; API key chỉ ở dạng `keyHint`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderConnection'
    post:
      tags:
        - Provider Connections
      operationId: createProviderConnection
      summary: Tạo Provider Connection (APR-09)
      description: Key được mã hóa trong kho bí mật; kết nối ở trạng thái Untested. Không có key mặc định của hệ thống.
      x-requirements:
        - AGENT-PROVIDER-002
        - INT-PROVIDER-005
        - NFR-SECRETS-001
      x-apr: APR-09
      x-priority: P0
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderConnectionCreate'
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /provider-connections/{connectionId}:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      tags:
        - Provider Connections
      operationId: getProviderConnection
      summary: Chi tiết Provider Connection
      x-requirements:
        - AGENT-PROVIDER-002
      x-priority: P0
      x-milestone: M1
      responses:
        '200':
          description: Kết nối.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConnection'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Provider Connections
      operationId: updateProviderConnection
      summary: Sửa tên, base URL hoặc API key (APR-09)
      description: Sửa base URL hoặc key đưa kết nối về Untested. Agent Run đang chạy không bị ảnh hưởng.
      x-requirements:
        - AGENT-PROVIDER-002
      x-apr: APR-09
      x-priority: P0
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ProviderConnectionUpdate'
      responses:
        '200':
          description: Đã cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags:
        - Provider Connections
      operationId: deleteProviderConnection
      summary: Xóa Provider Connection (APR-09)
      description: |
        Bị chặn (`409 connection_in_use`) nếu kết nối đang được gán cho agent, trừ khi chỉ định `replacementConnectionId`
        (AGENT-PROVIDER-002-AC03).
      x-requirements:
        - AGENT-PROVIDER-002
      x-apr: APR-09
      x-priority: P0
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: replacementConnectionId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /provider-connections/{connectionId}/test:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      tags:
        - Provider Connections
      operationId: testProviderConnection
      summary: Kiểm tra kết nối
      description: Gọi một yêu cầu nhẹ tới provider → Valid kèm danh sách model, hoặc Invalid kèm mã lỗi chuẩn (8.6).
      x-requirements:
        - AGENT-PROVIDER-002
        - INT-PROVIDER-001
      x-priority: P0
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Kết quả kiểm tra (kể cả Invalid — vẫn 200, xem `testStatus` và `lastError`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConnection'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents:
    get:
      tags:
        - Agent Models
      operationId: listAgents
      summary: Agent registry (Orchestrator + 7 Specialist Agent)
      x-requirements:
        - AGENT-REGISTRY-001
        - AGENT-SCOPE-001
      x-priority: P1
      x-milestone: M2
      responses:
        '200':
          description: Định nghĩa agent, chỉ đọc trong MVP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentDefinition'
  /agent-model-assignments:
    get:
      tags:
        - Agent Models
      operationId: listAgentModelAssignments
      summary: Cấu hình model của từng agent
      description: Trả cấu hình `default` và cấu hình hiệu lực cho cả 8 agent, kèm cảnh báo năng lực.
      x-requirements:
        - AGENT-PROVIDER-003
      x-priority: P0
      x-milestone: M1
      responses:
        '200':
          description: Danh sách gán model.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentModelAssignment'
  /agent-model-assignments/{agent}:
    parameters:
      - name: agent
        in: path
        required: true
        schema:
          oneOf:
            - $ref: '#/components/schemas/AgentName'
            - const: default
    put:
      tags:
        - Agent Models
      operationId: setAgentModelAssignment
      summary: Gán Provider Connection và model cho một agent (APR-09)
      description: Model phải thuộc `availableModels` hoặc được nhập và kiểm tra. Không áp dụng cho Agent Run đang chạy.
      x-requirements:
        - AGENT-PROVIDER-003
      x-apr: APR-09
      x-priority: P0
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - providerConnectionId
                - model
              properties:
                providerConnectionId:
                  $ref: '#/components/schemas/Id'
                model:
                  type: string
      responses:
        '200':
          description: Đã gán; có thể kèm `capabilityWarnings`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
        - Agent Models
      operationId: clearAgentModelAssignment
      summary: Bỏ gán riêng — agent dùng lại cấu hình default (APR-09)
      x-requirements:
        - AGENT-PROVIDER-003
      x-apr: APR-09
      x-priority: P0
      x-milestone: M1
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
