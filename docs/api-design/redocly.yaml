# Cấu hình kiểm tra spec: npx @redocly/cli lint openapi.yaml
extends:
  - recommended
# Chỉ áp cho OpenAPI 3.1 để lint AsyncAPI không báo "Unused rules".
oas3_1Rules:
  # Lỗi 4xx dùng chung components/responses.yaml; không bắt mọi operation khai báo 4xx.
  operation-4xx-response: off
  no-server-example.com: off
