  required: true
  schema: { $ref: schemas/common.yaml#/Id }
TaskId:
  name: taskId
  in: path
  required: true
  schema: { $ref: schemas/common.yaml#/Id }
PlanVersionId:
  name: planVersionId
  in: path
  required: true
  schema: { $ref: schemas/common.yaml#/Id }
ReferenceId:
  name: referenceId
  in: path
  required: true
  schema: { $ref: schemas/common.yaml#/Id }
EvidenceId:
  name: evidenceId
  in: path
  required: true
  schema: { $ref: schemas/common.yaml#/Id }
ClaimId:
  name: claimId
  in: path
  required: true
  schema: { $ref: schemas/common.yaml#/Id }
ArtifactId:
  name: artifactId
  in: path
  required: true
  schema: { $ref: schemas/common.yaml#/Id }
VersionId:
  name: versionId
  in: path
  required: true
  schema: { $ref: schemas/common.yaml#/Id }
WorkflowId:
  name: workflowId
  in: path
  required: true
