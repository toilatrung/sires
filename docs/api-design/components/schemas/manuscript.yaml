# LaTeX Manuscript Workspace và Diagram — PRD 5.8, 12, 13, 17.4, 17.5, 18.1, 18.2.

Compiler:
  type: string
  enum: [pdflatex, xelatex, lualatex]

Manuscript:
  allOf:
    - $ref: common.yaml#/EntityMeta
    - type: object
      description: Tối đa một Manuscript mỗi project (OQ-022).
      required: [initMode, mainFile, compiler, bibliographyTool, currentRevisionId]
      properties:
        initMode:
          type: string
          enum: [Default, Blank]
        mainFile: { type: string, default: main.tex }
        compiler: { $ref: '#/Compiler' }
        bibliographyTool:
          type: object
          properties:
            engine: { type: string, const: bibtex }
            package: { type: string, const: natbib }
            style: { type: string, default: plainnat }
        currentRevisionId: { $ref: common.yaml#/Id }
        currentRevisionNumber: { type: integer }
        latestBuild: { $ref: '#/Build' }

ManuscriptCreate:
  type: object
  required: [initMode]
  properties:
    initMode:
      type: string
      enum: [Default, Blank]
      description: Default tạo cấu trúc mẫu main.tex + references.bib (MS-TEMPLATE-001).
    compiler:
      $ref: '#/Compiler'
      default: pdflatex

ManuscriptUpdate:
  type: object
  minProperties: 1
  properties:
    mainFile: { type: string }
    compiler: { $ref: '#/Compiler' }

ManuscriptFile:
  type: object
  required: [id, path, fileType, contentHash, status]
  properties:
    id: { $ref: common.yaml#/Id }
    path:
      type: string
      description: Đường dẫn tương đối, duy nhất trong manuscript khi Active.
      examples: [sections/introduction.tex]
    fileType:
      type: string
      enum: [tex, bib, figure, other]
    contentHash: { type: string }
    sizeBytes: { type: integer }
    status:
      type: string
      enum: [Active, Deleted]
    updatedInRevision: { type: integer }

FileChange:
  type: object
  description: |
    Một thay đổi file. Với `add`, `modify` gửi đúng một nguồn nội dung: `content` (văn bản), `fileUploadId` (file vừa tải lên)
    hoặc `restoreFromRevisionId` (nội dung của file ở một revision cũ).
  required: [path, operation]
  properties:
    path: { type: string }
    operation:
      type: string
      enum: [add, modify, delete, rename]
    newPath:
      type: string
      description: Bắt buộc khi rename.
    content:
      type: string
      description: Nội dung mới (văn bản) khi add/modify.
    fileUploadId:
      $ref: common.yaml#/Id
      description: File nhị phân (hình) đã tải lên.
    restoreFromRevisionId:
      $ref: common.yaml#/Id
      writeOnly: true
      description: |
        Khôi phục (MS-REVISION-001): với `add`, `modify`, nội dung (văn bản hoặc nhị phân) lấy từ file có cùng `path` ở revision
        này của cùng Manuscript, thay cho `content`, `fileUploadId`. Revision không thuộc Manuscript hoặc không có file `path`
        trả `400 validation_failed`. Không dùng cho `bibliography/references.bib` (System sinh lại từ Bibliography Entry, MS-BIB-001).
    beforeHash: { type: string }
    afterHash: { type: string, readOnly: true }

RevisionCreate:
  type: object
  description: |
    Researcher sửa trực tiếp (MS-EDITOR-001). Mọi thay đổi file tạo một Manuscript Revision (MS-REVISION-001).
    `baseRevisionId` phải là revision hiện hành, nếu không trả 409 base_revision_mismatch. Xóa file thuộc APR-08 (xóa mềm).
    Khôi phục một file hoặc toàn bộ bản thảo về revision cũ là một revision mới, lịch sử giữ nguyên (MS-REVISION-001): mỗi file
    khác revision đích gửi `modify` (hoặc `add` nếu file đã xóa) kèm `restoreFromRevisionId`; khôi phục toàn bộ thì file không
    có ở revision đích gửi `delete`.
  required: [baseRevisionId, changes]
  properties:
    baseRevisionId: { $ref: common.yaml#/Id }
    changes:
      type: array
      minItems: 1
      items: { $ref: '#/FileChange' }
    message: { type: string }

ManuscriptRevision:
  type: object
  readOnly: true
  required: [id, revisionNumber, changes, source, createdBy, createdAt]
  properties:
    id: { $ref: common.yaml#/Id }
    revisionNumber: { type: integer }
    parentRevisionId: { $ref: common.yaml#/Id }
    changes:
      type: array
      items: { $ref: '#/FileChange' }
    source:
      type: string
      enum: [direct_edit, change_proposal, init]
      description: |
        Nguồn của revision (PRD 18.1). Chèn sơ đồ (MS-DIAGRAM-001) đi qua Change Proposal tạo bởi `insertDiagramIntoManuscript`,
        nên revision có `source = change_proposal` và `artifactVersionIds` khác rỗng; giao diện ghi nguồn này là “Chèn sơ đồ”
        (MS-REVISION-001). Khôi phục về revision cũ (`restoreFromRevisionId`) là `direct_edit`, actor Researcher.
    changeProposalId: { $ref: common.yaml#/Id }
    taskId: { $ref: common.yaml#/Id }
    artifactVersionIds:
      type: array
      items: { $ref: common.yaml#/Id }
    message: { type: string }
    createdBy: { $ref: common.yaml#/ActorRef }
    createdAt: { $ref: common.yaml#/Timestamp }

DiffHunk:
  type: object
  description: |
    Một khối thay đổi theo unified diff: `oldStart`, `oldLines`, `newStart`, `newLines` là bốn số của dòng đầu khối
    `@@ -oldStart,oldLines +newStart,newLines @@`.
  properties:
    oldStart: { type: integer }
    oldLines: { type: integer, description: Số dòng ngữ cảnh và dòng bỏ. }
    newStart: { type: integer }
    newLines: { type: integer, description: Số dòng ngữ cảnh và dòng thêm. }
    lines:
      type: array
      description: |
        Các dòng theo quy ước unified diff: ký tự đầu `+` (dòng thêm), `-` (dòng bỏ) hoặc dấu cách (dòng ngữ cảnh, không đổi),
        tiếp theo là nội dung dòng, không kèm ký tự xuống dòng. Dòng bắt đầu bằng `\` là ghi chú (ví dụ
        `\ No newline at end of file`), không tính vào `oldLines`, `newLines`.
      items: { type: string }

ChangeProposalStatus:
  type: string
  enum: [Proposed, Accepted, Rejected, Outdated]

ChangeProposal:
  allOf:
    - $ref: common.yaml#/EntityMeta
    - type: object
      description: Chấp nhận/từ chối nguyên khối (OQ-083, DEC-35).
      required: [manuscriptId, baseRevisionId, diff, createdByAgentRunId, status, provenance]
      properties:
        manuscriptId: { $ref: common.yaml#/Id }
        baseRevisionId: { $ref: common.yaml#/Id }
        summary: { type: string }
        diff:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              operation:
                type: string
                enum: [add, modify, delete]
              hunks:
                type: array
                items: { $ref: '#/DiffHunk' }
        taskId: { $ref: common.yaml#/Id }
        claimIds:
          type: array
          items: { $ref: common.yaml#/Id }
        evidenceIds:
          type: array
          items: { $ref: common.yaml#/Id }
        artifactVersionIds:
          type: array
          items: { $ref: common.yaml#/Id }
        createdByAgentRunId: { $ref: common.yaml#/Id }
        citationCheck:
          type: object
          description: Kết quả kiểm tra citation (CLAIM-CITATION-001) — điều kiện để chấp nhận.
          properties:
            verificationResultId: { $ref: common.yaml#/Id }
            passed: { type: boolean }
            unresolvedKeys:
              type: array
              items: { type: string }
            mismatches:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  claimId: { $ref: common.yaml#/Id }
                  message: { type: string }
        status: { $ref: '#/ChangeProposalStatus' }
        approval: { $ref: common.yaml#/ApprovalRecord }
        resultingRevisionId: { $ref: common.yaml#/Id }
        provenance:
          allOf:
            - $ref: common.yaml#/Provenance
          description: Provenance (18.3, DATA-PROV-001) — Change Proposal luôn do agent tạo (`createdByAgentRunId`).

DiagramInsertionRequest:
  type: object
  description: Chèn sơ đồ đã Accepted vào bản thảo (MS-DIAGRAM-001); tạo Change Proposal chờ APR-05.
  required: [artifactVersionId, targetPath]
  properties:
    artifactVersionId: { $ref: common.yaml#/Id }
    targetPath: { type: string, examples: [sections/method.tex] }
    afterLine: { type: integer }
    caption: { type: string }
    label: { type: string, examples: ['fig:architecture'] }

BibliographyEntry:
  type: object
  readOnly: true
  required: [id, manuscriptId, bibtexKey, referenceId, bibtex, generatedFromMetadataVersion]
  properties:
    id: { $ref: common.yaml#/Id }
    manuscriptId: { $ref: common.yaml#/Id }
    bibtexKey: { type: string }
    referenceId: { $ref: common.yaml#/Id }
    referenceApprovalStatus: { $ref: library.yaml#/ReferenceApprovalStatus }
    bibtex: { type: string }
    generatedFromMetadataVersion: { type: integer }
    citedInFiles:
      type: array
      items: { type: string }

BuildStatus:
  type: string
  enum: [Queued, Running, Succeeded, Failed]

BuildIssue:
  type: object
  description: |
    Lỗi hoặc cảnh báo đã phân tích từ log (MS-BUILD-001). Giao diện dựng tiêu đề và câu giải thích theo ngôn ngữ giao diện từ
    `code` và `params` (UX-MS-004, UX-I18N-002); log gốc xem bằng `getBuildLog`.
  properties:
    severity:
      type: string
      enum: [error, warning]
    file: { type: string }
    line: { type: integer }
    code:
      type: string
      description: |
        Mã ổn định để client dịch. Danh mục cho lỗi phổ biến, phân loại bằng quy tắc xác định (MS-BUILD-001, MS-BUILDENV-001):
        `unbalanced_braces` (thiếu hoặc thừa dấu ngoặc); `undefined_control_sequence` (lệnh không xác định; `params.command`);
        `missing_file` (không tìm thấy file được `\input`, `\include`, `\includegraphics`; `params.path`); `missing_package`
        (package chưa được nạp hoặc không có trong bộ TeX Live của build; `params.package`, thêm `params.command` khi biết lệnh cần
        package); `undefined_citation` (citation key không có trong bibliography; `params.key`); `shell_escape_disabled` (lệnh cần
        shell-escape không được chạy; `params.command`); `path_outside_manuscript` (đọc file ngoài thư mục Manuscript;
        `params.path`); `timeout` (quá thời gian; `params.limit`); `memory_limit` (quá bộ nhớ, kể cả TeX hết dung lượng trong;
        `params.limit`, `params.reason`); `infrastructure_unavailable` (không cấp được môi trường build). Mã ngoài danh mục là lỗi
        chưa có quy tắc xác định: client hiện tiêu đề chung theo `severity` kèm mã.
      examples: [missing_package, undefined_citation, missing_file, timeout, memory_limit]
    params:
      type: object
      description: |
        Tham số để dựng câu theo ngôn ngữ giao diện, khóa theo `code`: `package`, `path`, `key`, `command`, `limit` (giới hạn đã
        vượt: số giây với `timeout`, số MB với `memory_limit`), `reason` (với `memory_limit`: `tex_capacity` khi TeX hết dung lượng
        trong, `memory` khi chạm giới hạn bộ nhớ của môi trường build). Giá trị giữ nguyên văn từ tài liệu hoặc log, không dịch.
      additionalProperties: { type: string }
      examples:
        - { package: booktabs, command: '\toprule' }
    message:
      type: string
      description: Thông báo gốc trích từ log của compiler, không dịch.
    friendlyMessage:
      type: string
      description: |
        Gợi ý giải thích thêm, có thể do agent soạn cho lỗi ngoài danh mục (MS-BUILD-001: “ghi rõ là gợi ý”). Viết theo
        `Preferences.uiLanguage` của tài khoản lúc build, không dịch lại khi đổi ngôn ngữ; không thay câu giao diện dựng từ
        `code`, `params`.

Build:
  type: object
  readOnly: true
  description: Build cô lập, không shell-escape, giới hạn mặc định 120 s / 2 GB (MS-BUILDENV-001, NFR-SANDBOX).
  required: [id, manuscriptId, revisionId, status, queuedAt]
  properties:
    id: { $ref: common.yaml#/Id }
    manuscriptId: { $ref: common.yaml#/Id }
    revisionId: { $ref: common.yaml#/Id }
    revisionNumber: { type: integer }
    compiler: { $ref: '#/Compiler' }
    status: { $ref: '#/BuildStatus' }
    queuedAt: { $ref: common.yaml#/Timestamp }
    startedAt: { $ref: common.yaml#/Timestamp }
    endedAt: { $ref: common.yaml#/Timestamp }
    issues:
      type: array
      items: { $ref: '#/BuildIssue' }
    citationKeysFound:
      type: array
      items: { type: string }
    unresolvedKeys:
      type: array
      items: { type: string }
    hasPdf: { type: boolean }

DiagramType:
  type: object
  description: |
    Loại sơ đồ hỗ trợ (DIAG-TYPES-001): đúng năm loại Sequence, Component, Activity, State, Workflow; cả năm dùng Mermaid
    trong MVP (OQ-059). Loại ngoài danh sách (ví dụ Gantt) không hỗ trợ (DIAG-TYPES-001-AC02).
  required: [id, label, syntax]
  properties:
    id:
      type: string
      description: |
        Mã loại. Cú pháp mặc định theo DIAG-TYPES-001: `sequence` → sequenceDiagram; `component` → flowchart có subgraph
        cho từng thành phần; `activity`, `workflow` → flowchart; `state` → stateDiagram-v2.
      examples: [sequence, component, activity, state, workflow]
    label: { type: string }
    syntax: { type: string, const: mermaid }

DiagramRequest:
  type: object
  description: Yêu cầu Diagram Agent tạo sơ đồ (DIAG-GEN-001); đầu ra là Artifact Version diagram ở Draft.
  required: [description]
  properties:
    description: { type: string, minLength: 1 }
    diagramType:
      type: string
      description: "`DiagramType.id`. Bỏ trống thì Orchestrator chọn loại (DIAG-TYPES-001); khi sửa sơ đồ thì giữ loại hiện tại."
      examples: [workflow]
    taskId: { $ref: common.yaml#/Id }
    inputRefs:
      type: array
      description: Chỉ artifact version Accepted, evidence, context item (CTX-ASSEMBLY-001).
      items: { $ref: common.yaml#/TypedRef }
    revisesArtifactId:
      $ref: common.yaml#/Id
      description: Sửa sơ đồ đã có — tạo version mới của artifact này.

DiagramValidationRequest:
  type: object
  required: [source]
  properties:
    source: { type: string, description: Mã nguồn Mermaid. }

DiagramValidationResult:
  type: object
  properties:
    valid: { type: boolean }
    errors:
      type: array
      items:
        type: object
        properties:
          line: { type: integer }
          message: { type: string }
    previewSvg:
      type: string
      description: SVG render khi hợp lệ (renderer cô lập — INT-DIAGRAM).

DiagramValidationStatus:
  type: string
  description: |
    Trạng thái kiểm tra nguồn sơ đồ (DIAG-VALIDATE-001): `valid` — cú pháp đúng và render được preview; `syntax_error` —
    trình phân tích Mermaid báo lỗi cú pháp; `render_error` — cú pháp đúng nhưng render lỗi (quá lớn, quá thời gian;
    WF-07.E2).
  enum: [valid, syntax_error, render_error]

DiagramValidation:
  type: object
  readOnly: true
  description: |
    Kết quả kiểm tra nguồn của chính Artifact Version diagram (DIAG-SOURCE-001: mỗi version lưu trạng thái kiểm tra;
    DIAG-VALIDATE-001). System ghi khi tạo version — Diagram Agent ghi đầu ra hoặc Researcher lưu nguồn
    (`createArtifactVersion`) — bằng cùng bộ kiểm tất định của `validateDiagramSource`; version bất biến nên kết quả không
    đổi. Version khác `valid` vẫn được lưu ở Draft kèm lỗi để Researcher sửa tay, nhưng không chấp nhận được
    (DIAG-REVIEW-001).
  required: [status]
  properties:
    status: { $ref: '#/DiagramValidationStatus' }
    errors:
      type: array
      description: Có khi `status` khác `valid`; cùng dạng `DiagramValidationResult.errors`.
      items:
        type: object
        required: [message]
        properties:
          line:
            type: integer
            minimum: 1
            description: Dòng của nguồn, đếm từ 1 (DIAG-VALIDATE-001-AC01); không có với lỗi render.
          message: { type: string }

ManuscriptUsage:
  type: object
  readOnly: true
  description: |
    Vị trí một claim, evidence hoặc artifact version được dùng trong bản thảo (SYN-PERSIST-001: khi được dùng trong bản
    thảo, ghi vị trí sử dụng — file, revision — từ Change Proposal đã chấp nhận; PRD 4.3 điều hướng hai chiều). Có một
    mục cho mỗi file trong `diff` của Change Proposal đã chấp nhận chứa đối tượng ở `claimIds`, `evidenceIds` hoặc
    `artifactVersionIds` (Change Proposal không ghi đối tượng nằm ở file nào). Vị trí giữ nguyên khi có revision hay
    version Accepted mới hơn (SYN-PERSIST-001). Dữ liệu gốc thuộc manuscript; đường dữ liệu sang research (sự kiện hoặc
    API nội bộ) bổ sung khi làm hợp đồng manuscript (PID-00079), tới khi đó các trường dùng schema này không có.
  required: [path, revisionId, changeProposalId]
  properties:
    path: { type: string, examples: [sections/related-work.tex] }
    revisionId:
      $ref: common.yaml#/Id
      description: Revision tạo ra khi chấp nhận Change Proposal (`resultingRevisionId`).
    revisionNumber: { type: integer }
    changeProposalId: { $ref: common.yaml#/Id }
    citationKeys:
      type: array
      description: |
        Chỉ với evidence — BibTeX key của citation trong file đó trỏ tới reference của evidence (CLAIM-CITATION-001: liên
        kết từng citation tới evidence).
      items: { type: string }
    at: { $ref: common.yaml#/Timestamp }
