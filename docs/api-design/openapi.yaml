openapi: 3.1.0
info:
  title: SIRes API (MVP)
  version: 0.1.0-mvp
  summary: REST API cho SIRes (Super Intelligence Researcher) — phạm vi MVP.
  description: |
    Đặc tả API mức MVP, suy ra từ PRD SIRes v1.0 (PO duyệt qua phiếu chốt PC-01, 31/10/2026).
    Mỗi file trong `paths/` tương ứng một mục của PRD (`docs/overview/sections/NN-slug.html`);
    schema trong `components/schemas/` lấy từ mục 5 (Core Domain Model) và mục 18 (Data and State Specifications).

    **Trạng thái:** Assumption — bản đề xuất của biên soạn, chưa phải quyết định kiến trúc.
    Technology stack chưa chọn (DEC-27, OQ-091); API không giả định framework cụ thể.

    ## Quy ước chung
    - **Xác thực:** duy nhất qua eTroy OIDC (INT-OIDC-001–004). Backend SIRes là OIDC Relying Party,
      giữ token phía server và cấp cookie phiên `sires_session` (HttpOnly, Secure, SameSite=Lax).
      Lệnh ghi (POST/PUT/PATCH/DELETE) gửi kèm header `X-CSRF-Token`.
    - **Ownership:** mọi tài nguyên thuộc tài khoản của phiên; tài nguyên của tài khoản khác trả `404`
      (không tiết lộ sự tồn tại — OWN-03, NFR-ISOL). Tài nguyên cấp project nằm dưới `/projects/{projectId}`.
    - **Idempotency:** lệnh có tác động (kích hoạt Task, duyệt, trả lời prompt, chấp nhận proposal,
      gửi kết quả manual, tạo project…) bắt buộc header `Idempotency-Key` (DATA-IDEMP-001).
      Gửi lại cùng khóa trả về kết quả lần đầu.
    - **Concurrency:** entity sửa được trả `ETag` = `rowVersion`; PATCH/PUT bắt buộc `If-Match`.
      Lệch phiên bản trả `412` (DATA-CONC-001).
    - **Chuyển trạng thái:** mỗi chuyển trạng thái là một endpoint hành động (`POST …/approve`, `…/activate`).
      Chuyển không có trong bảng 18.2 trả `409` với `code = invalid_transition` (DATA-STATE-001);
      hành động bị chặn theo quyền theo trạng thái trả `409` `code = action_not_allowed_in_state` (DATA-STATE-002).
    - **Phê duyệt (APR-01–APR-10):** chỉ Researcher thực hiện qua phiên người dùng. Agent không bao giờ gọi các
      endpoint này (REL-04); mọi phê duyệt sinh `ApprovalRecord` và `AuditEvent`.
    - **Tác vụ dài:** endpoint khởi chạy agent trả `202 Accepted` cùng `Workflow`; tiến trình theo dõi qua
      `GET /workflows/{workflowId}` hoặc luồng sự kiện `GET /events` (Server-Sent Events).
    - **Lỗi:** `application/problem+json` (RFC 9457) với trường `code` ổn định.
    - **Phân trang:** cursor — `?limit=&cursor=`; phản hồi có `nextCursor`.
    - **Bí mật:** API key chỉ được gửi vào (write-only), không bao giờ trả ra; chỉ có `keyHint` (REL-07).

    Mục lục và bảng truy vết: `docs/api-design/index.html`. Quy ước biên soạn: `docs/api-design/README.md`.
  contact:
    name: eTroy — đội SWE, GEN AI, AIE và PO
  license:
    name: eTroy Non-Commercial License 1.0 (see LICENSES.md)
    identifier: LicenseRef-eTroy-NC-1.0

servers:
  - url: https://{host}/api/v1
    description: Môi trường cloud do đội phát triển vận hành (DEC-27); host chốt khi chọn hạ tầng.
    variables:
      host:
        default: sires.etroy.local
  - url: http://localhost:8080/api/v1
    description: Phát triển cục bộ

security:
  - sessionCookie: []

