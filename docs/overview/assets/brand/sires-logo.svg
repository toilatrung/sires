<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 128" role="img" aria-label="SIRES">
  <!-- geometric S: three stacked boards joined by folds; the top board is the mortarboard -->
  <!-- bottom board -->
  <path d="M14 94 L64 80 L114 94 L64 108 Z" fill="#2A5A76"/>
  <path d="M14 94 L64 108 V114 L14 100 Z" fill="#15303F"/>
  <!-- right fold -->
  <path d="M64 74 L114 60 V100 L64 114 Z" fill="#1E4258"/>
  <!-- middle board -->
  <path d="M14 60 L64 46 L114 60 L64 74 Z" fill="#2A5A76"/>
  <!-- left fold -->
  <path d="M14 26 L64 40 V80 L14 66 Z" fill="#15303F"/>
  <!-- top board (mortarboard) -->
  <path d="M64 40 L114 26 V32 L64 46 Z" fill="#1E4258"/>
  <path d="M14 26 L64 12 L114 26 L64 40 Z" fill="#2A5A76"/>
  <!-- tassel, hanging inside the upper opening of the S -->
  <path d="M64 26 L108 27 V40" fill="none" stroke="#E0A43A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="64" cy="26" r="3.5" fill="#E0A43A"/>
  <rect x="104.5" y="38.5" width="7" height="4.5" rx="1.5" fill="#C98B22"/>
  <path d="M108 41 L103.5 55 Q108 57.5 112.5 55 Z" fill="#E0A43A"/>
  <text x="140" y="84" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="4" fill="#244F68">SIRES</text>
  <rect x="142" y="94" width="40" height="4" rx="2" fill="#E0A43A"/>
</svg>
