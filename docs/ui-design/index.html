<html lang="vi">
<head>
<meta charset="utf-8">

<title>SIRes UI</title>
<!-- Generated by tools/render.mjs from tools/index.template.html. Edit the template, then re-run. -->
<link rel="icon" href="assets/sires-logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ground:#F6F2EE;--surface:#FCF9F5;--control:#E5DED5;--line:#DBD3C7;--ink:#1C1B18;--muted:#4D4A44;--brand:#0277DD;--brand-ink:#025FAC;--selected:#E5DED5;--canvas:#EFEAE3}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.5 Montserrat,system-ui,sans-serif;display:flex;flex-direction:column}
a{color:var(--brand-ink)}a:hover{color:var(--ink)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #80B9EE;outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
header .brand{display:flex;align-items:center;gap:14px}
header img{height:28px;display:block}
header h1{margin:0;font-size:16px;font-weight:600}
header nav{display:flex;gap:16px;font-size:14px}
.shell{flex:1;min-height:0;display:flex;flex-wrap:wrap}
aside{flex:1 1 260px;max-width:300px;min-height:0;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px}
aside label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 4px 6px}
aside input{width:100%;height:36px;padding:0 12px;border:1px solid #C7C7C7;border-radius:6px;background:var(--control)}
aside h2{margin:20px 4px 6px;font-size:12px;font-weight:600;color:var(--muted)}
aside ul{list-style:none;margin:0;padding:0}
aside a{display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:34px;padding:4px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13px}
aside a:hover{background:var(--ground)}
aside a[aria-current="true"]{background:var(--selected);font-weight:600}
aside a small{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
main{flex:999 1 560px;min-width:0;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.bar h2{margin:0;font-size:18px;font-weight:600}
.bar p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.controls select{height:34px;padding:0 10px;border:1px solid #C7C7C7;border-radius:6px;background:var(--control);max-width:260px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{height:32px;padding:0 12px;border:0;background:var(--surface);cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.open{display:inline-flex;align-items:center;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-decoration:none;color:var(--ink);font-size:13px}
.stage{flex:1;min-height:0;overflow:auto;background:var(--canvas);padding:20px}
.frame{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 auto;transform-origin:top left}
.frame iframe{display:block;border:0;background:var(--ground)}
@media (max-width:760px){aside{max-width:none;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="assets/sires-logo.svg" alt="SIRes"><h1>Bộ thiết kế giao diện</h1></div>
  <nav aria-label="Tài liệu"><a href="design.md">design.md</a><a href="README.md">README</a></nav>
</header>
<div class="shell">
  <aside aria-label="Màn hình và component">
    <label for="q">Tìm màn hình</label>
    <input id="q" type="search" placeholder="Ví dụ: Plan, Settings, P3">
    <div id="list"></div>
  </aside>
  <main>
    <div class="bar">
      <div><h2 id="title">—</h2><p id="meta"></p></div>
      <div class="controls">
        <label class="sr" for="variant" style="font-size:12px;color:var(--muted)">Biến thể</label>
        <select id="variant"></select>
        <div class="seg" role="group" aria-label="Khổ màn hình">
          <button type="button" data-w="1440">Desktop</button>
          <button type="button" data-w="1024">Tablet</button>
          <button type="button" data-w="390">Điện thoại</button>
        </div>
        <a class="open" id="open" target="_blank" rel="noopener">Mở riêng</a>
      </div>
    </div>
    <div class="stage" id="stage"><div class="frame" id="frame"><iframe id="view" title="Xem trước"></iframe></div></div>
  </main>
</div>
<script>
const groups = [{"id":"foundation","name":"Nền tảng","items":[{"name":"AgentListPreview","title":"Agent List · light và dark","width":920,"height":560,"fill":false,"variants":[{"label":"Mặc định","file":"pages/AgentListPreview.html"},{"label":"wfState: waiting","file":"pages/AgentListPreview--wfState-waiting.html"},{"label":"wfState: interrupted","file":"pages/AgentListPreview--wfState-interrupted.html"}]},{"name":"AgentList","title":"AgentList (dùng chung)","width":380,"height":420,"fill":false,"variants":[{"label":"Mặc định","file":"pages/AgentList.html"},{"label":"wfState: waiting","file":"pages/AgentList--wfState-waiting.html"},{"label":"wfState: interrupted","file":"pages/AgentList--wfState-interrupted.html"},{"label":"theme: dark","file":"pages/AgentList--theme-dark.html"}]},{"name":"ProjectRail","title":"ProjectRail (dùng chung)","width":240,"height":900,"fill":false,"variants":[{"label":"Mặc định","file":"pages/ProjectRail.html"}]},{"name":"Main","title":"Style guide (Cream)","width":1280,"height":1240,"fill":false,"variants":[{"label":"Mặc định","file":"pages/Main.html"}]},{"name":"Components","title":"Thành phần và trạng thái","width":1440,"height":1300,"fill":false,"variants":[{"label":"Mặc định","file":"pages/Components.html"}]},{"name":"TopBar","title":"TopBar (dùng chung)","width":1440,"height":57,"fill":false,"variants":[{"label":"Mặc định","file":"pages/TopBar.html"}]}]},{"id":"global","name":"Global Workspace","items":[{"name":"Dashboard","title":"G1 · Dashboard","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Dashboard.html"},{"label":"state: recovery","file":"pages/Dashboard--state-recovery.html"},{"label":"state: first-run","file":"pages/Dashboard--state-first-run.html"}]},{"name":"Projects","title":"G2 · Research Projects","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Projects.html"}]},{"name":"Discover","title":"G3 · Discover","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Discover.html"}]},{"name":"Library","title":"G4 · Trusted Library (duyệt theo lô)","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Library.html"},{"label":"state: empty","file":"pages/Library--state-empty.html"}]},{"name":"Reference","title":"G5 · Chi tiết Reference","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Reference.html"}]},{"name":"Assistant","title":"G6 · Global AI Assistant","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Assistant.html"}]},{"name":"GlobalTasks","title":"G7 · Tasks & Plan (tổng hợp)","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/GlobalTasks.html"}]},{"name":"GlobalActivity","title":"G8 · Agent Activity (Global)","width":1440,"height":900,"fill":true,"variants":[{"label":"Mặc định","file":"pages/GlobalActivity.html"}]},{"name":"PendingActions","title":"G9 · Pending Actions","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/PendingActions.html"}]}]},{"id":"settings","name":"Settings & Sign-in","items":[{"name":"SignIn","title":"S0 · Đăng nhập (eTroy OIDC)","width":1440,"height":900,"fill":true,"variants":[{"label":"Mặc định","file":"pages/SignIn.html"},{"label":"state: oidc-error","file":"pages/SignIn--state-oidc-error.html"},{"label":"state: session-expired","file":"pages/SignIn--state-session-expired.html"}]},{"name":"SettingsProfile","title":"S1 · Profile","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/SettingsProfile.html"},{"label":"state: invalid-url","file":"pages/SettingsProfile--state-invalid-url.html"}]},{"name":"SettingsProviders","title":"S2 · Provider Connections","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/SettingsProviders.html"}]},{"name":"SettingsAgents","title":"S3 · Agent Models","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/SettingsAgents.html"},{"label":"state: confirm-embedding","file":"pages/SettingsAgents--state-confirm-embedding.html"}]},{"name":"SettingsPreferences","title":"S4 · Preferences","width":1440,"height":1100,"fill":true,"variants":[{"label":"Mặc định","file":"pages/SettingsPreferences.html"},{"label":"debug: bật","file":"pages/SettingsPreferences--debug.html"}]}]},{"id":"project","name":"Project Workspace","items":[{"name":"Overview","title":"P1 · Overview","width":1440,"height":1100,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Overview.html"},{"label":"state: no-plan","file":"pages/Overview--state-no-plan.html"},{"label":"state: archived","file":"pages/Overview--state-archived.html"},{"label":"state: recovery","file":"pages/Overview--state-recovery.html"}]},{"name":"Chat","title":"P2 · Project AI Chat + Agent Prompt","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Chat.html"}]},{"name":"Plan","title":"P3 · Plan and Tasks (board + chi tiết Task)","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Plan.html"}]},{"name":"PlanCompare","title":"P4 · So sánh và duyệt Plan Version","width":1440,"height":1100,"fill":true,"variants":[{"label":"Mặc định","file":"pages/PlanCompare.html"}]},{"name":"TaskReview","title":"P5 · Nghiệm thu Task (In Review)","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/TaskReview.html"}]},{"name":"Evidence","title":"P6 · References and Evidence + Evidence Inspector","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Evidence.html"}]},{"name":"Artifacts","title":"P7 · Research Artifacts","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Artifacts.html"}]},{"name":"Manuscript","title":"P8 · Manuscript (proposal, build log, lịch sử)","width":1440,"height":900,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Manuscript.html"},{"label":"rightPane: build-log","file":"pages/Manuscript--rightPane-build-log.html"},{"label":"rightPane: history","file":"pages/Manuscript--rightPane-history.html"},{"label":"proposal: citation-error","file":"pages/Manuscript--proposal-citation-error.html"},{"label":"proposal: outdated","file":"pages/Manuscript--proposal-outdated.html"}]},{"name":"Workflow","title":"P9 · Agent Activity: workflow + Agent Run","width":1440,"height":1100,"fill":true,"variants":[{"label":"Mặc định","file":"pages/Workflow.html"},{"label":"state: running","file":"pages/Workflow--state-running.html"},{"label":"state: interrupted","file":"pages/Workflow--state-interrupted.html"},{"label":"debug: bật","file":"pages/Workflow--debug.html"}]},{"name":"History","title":"P10 · Activity and History","width":1440,"height":1000,"fill":true,"variants":[{"label":"Mặc định","file":"pages/History.html"}]}]},{"id":"states","name":"Trạng thái & Mobile","items":[{"name":"MobilePending","title":"M1 · Pending Actions (390px)","width":390,"height":844,"fill":false,"variants":[{"label":"Mặc định","file":"pages/MobilePending.html"}]},{"name":"MobilePrompt","title":"M2 · Trả lời prompt (390px)","width":390,"height":844,"fill":false,"variants":[{"label":"Mặc định","file":"pages/MobilePrompt.html"}]},{"name":"States","title":"X1 · Loading, trống, lỗi, khôi phục","width":1440,"height":1100,"fill":false,"variants":[{"label":"Mặc định","file":"pages/States.html"}]}]}];
const items = groups.flatMap(g => g.items);
const $ = id => document.getElementById(id);
let current = null, width = null;

function renderList(filter) {
  const q = (filter || '').toLowerCase();
  $('list').innerHTML = groups.map(g => {
    const rows = g.items.filter(it => !q || (it.title + ' ' + it.name).toLowerCase().includes(q));
    if (!rows.length) return '';
    return '<h2>' + g.name + '</h2><ul>' + rows.map(it =>
      '<li><a href="#' + it.name + '" aria-current="' + (current && current.name === it.name) + '">' +
      '<span>' + it.title + '</span>' + (it.variants.length > 1 ? '<small>' + it.variants.length + '</small>' : '') + '</a></li>'
    ).join('') + '</ul>';
  }).join('');
}

function fit() {
  if (!current) return;
  const w = width || current.width, h = current.fill ? Math.max(current.height, 900) : current.height;
  const avail = $('stage').clientWidth - 40;
  const s = Math.min(1, avail / w);
  const v = $('view');
  v.style.width = w + 'px'; v.style.height = h + 'px';
  $('frame').style.width = w + 'px'; $('frame').style.height = h + 'px';
  $('frame').style.transform = 'scale(' + s + ')';
  $('frame').style.marginBottom = (h * s - h) + 'px';
  $('frame').style.marginRight = (w * s - w) + 'px';
}

function show() {
  const [name, key] = decodeURIComponent(location.hash.slice(1)).split('|');
  current = items.find(it => it.name === name) || items.find(it => it.name === 'Dashboard') || items[0];
  const variant = current.variants.find(v => v.file.endsWith('--' + key + '.html')) || current.variants[0];
  $('title').textContent = current.title;
  $('meta').textContent = 'source/' + current.name + '.dc.html · ' + current.width + ' × ' + current.height;
  $('variant').innerHTML = current.variants.map(v => '<option value="' + v.file + '"' + (v === variant ? ' selected' : '') + '>' + v.label + '</option>').join('');
  $('variant').disabled = current.variants.length < 2;
  $('view').src = variant.file; $('open').href = variant.file;
  width = current.fill ? width : null;
  document.querySelectorAll('.seg button').forEach(b => { b.disabled = !current.fill; b.setAttribute('aria-pressed', String(current.fill && +b.dataset.w === (width || 1440))); });
  renderList($('q').value); fit();
}

$('variant').onchange = e => {
  const file = e.target.value, m = file.match(/--(.+)\.html$/);
  history.replaceState(null, '', '#' + current.name + (m ? '|' + m[1] : ''));
  $('view').src = file; $('open').href = file;
};
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { width = +b.dataset.w; show(); });
$('q').oninput = e => renderList(e.target.value);
addEventListener('hashchange', show);
addEventListener('resize', fit);
show();
</script>
</body>
</html>
