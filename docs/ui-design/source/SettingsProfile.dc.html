<html lang="vi">
<head>
<meta charset="utf-8">
<title>SIRes — Settings: Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F2EE}
a{color:#025FAC}a:hover{color:#1C1B18}
</style>
</helmet>
<div style="min-height: 1000px; background: #F6F2EE; color: #1C1B18; font-family: Montserrat, system-ui, sans-serif">
  <dc-import name="TopBar" mode="global" active="settings" hint-size="100%,57px"></dc-import>
  <div style="max-width: 1180px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 32px) 64px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
    <nav aria-label="Settings" style="flex: 1 1 200px; max-width: 240px; display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0 0 12px; font-family: Montserrat, system-ui, sans-serif; font-weight: 600; font-size: 28px">Settings</h1>
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: {{n.w}}; color: #1C1B18; background: {{n.bg}}">{{n.label}}</a>
      </sc-for>
    </nav>
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <h2 style="margin: 0; font-family: Montserrat, system-ui, sans-serif; font-weight: 600; font-size: 24px">Profile</h2>
      <section style="background: #FCF9F5; border: 1px solid #DBD3C7; border-radius: 8px; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; align-items: center; gap: 16px">
          <span style="width: 64px; height: 64px; border-radius: 32px; background: #EAF4FE; color: #025FAC; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600" aria-hidden="true">NT</span>
          <button style="height: 38px; padding: 0 14px; border: 1px solid #DBD3C7; border-radius: 6px; background: #FCF9F5; color: #1C1B18; font: 500 14px Montserrat, sans-serif">Đổi ảnh đại diện</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Họ tên hiển thị
            <input value="Nguyễn Thanh" style="background: #E5DED5; height: 40px; padding: 0 12px; border: 1px solid #C7C7C7; border-radius: 6px; font: 400 14px Montserrat, sans-serif; color: #1C1B18">
            <span style="font-weight: 400; font-size: 12px; color: #4D4A44">Lần đầu lấy từ eTroy</span>
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Email
            <input value="thanh.nguyen@etroy.example" readonly style="height: 40px; padding: 0 12px; border: 1px solid #C7C7C7; border-radius: 6px; background: #F6F2EE; font: 400 14px Montserrat, sans-serif; color: #4D4A44">
            <span style="font-weight: 400; font-size: 12px; color: #4D4A44">Chỉ đọc · do eTroy quản lý</span>
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Đơn vị công tác
            <input value="Khoa Công nghệ Thông tin" style="background: #E5DED5; height: 40px; padding: 0 12px; border: 1px solid #C7C7C7; border-radius: 6px; font: 400 14px Montserrat, sans-serif; color: #1C1B18">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Lĩnh vực nghiên cứu
            <input value="Xử lý ngôn ngữ tự nhiên, truy xuất thông tin" style="background: #E5DED5; height: 40px; padding: 0 12px; border: 1px solid #C7C7C7; border-radius: 6px; font: 400 14px Montserrat, sans-serif; color: #1C1B18">
          </label>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">URL hồ sơ Google Scholar
          <input value="scholar.google.com/citations?user=" aria-invalid="{{invalid}}" aria-describedby="gs-err" style="background: #E5DED5; height: 40px; padding: 0 12px; border: 1.5px solid {{urlBorder}}; border-radius: 6px; font: 400 14px 'JetBrains Mono', monospace; color: #1C1B18">
          <sc-if value="{{isInvalid}}" hint-placeholder-val="{{ false }}"><span id="gs-err" style="font-weight: 600; font-size: 12px; color: #BE123C">URL không đúng định dạng — cần bắt đầu bằng https://. Chưa lưu thay đổi.</span></sc-if>
          <span style="font-weight: 400; font-size: 12px; color: #4D4A44">Chỉ là liên kết, không phải đăng nhập Google.</span>
        </label>
      </section>
      <section style="background: #FCF9F5; border: 1px solid #DBD3C7; border-radius: 8px; padding: 20px 24px; display: flex; gap: 16px; align-items: flex-start">
        <button role="switch" aria-checked="false" aria-labelledby="ctx-l" style="flex-shrink: 0; width: 44px; height: 26px; padding: 3px; border: 1px solid #4D4A44; border-radius: 6px; background: #FCF9F5; display: flex; justify-content: flex-start"><span style="width: 18px; height: 18px; border-radius: 9px; background: #4D4A44"></span></button>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span id="ctx-l" style="font-size: 14px; font-weight: 600">Dùng lĩnh vực nghiên cứu làm context cho agent · Tắt</span>
          <span style="font-size: 13px; line-height: 1.5; color: #4D4A44">Khi bật, chỉ “Lĩnh vực nghiên cứu” được gửi cho agent. Họ tên, email, đơn vị, ảnh và URL Scholar không bao giờ được gửi.</span>
        </div>
      </section>
      <div style="display: flex; gap: 8px">
        <button style="height: 44px; padding: 0 18px; border: 1px solid #0277DD; border-radius: 6px; background: #0277DD; color: #FFFFFF; font: 600 14px Montserrat, sans-serif">Lưu thay đổi</button>
        <button style="height: 44px; padding: 0 16px; border: 1px solid #DBD3C7; border-radius: 6px; background: #FCF9F5; color: #1C1B18; font: 500 14px Montserrat, sans-serif">Hủy</button>
      </div>
      <p style="margin: 0; font-size: 13px; color: #4D4A44">Không có mật khẩu hay phương thức đăng nhập nào khác ngoài eTroy.</p>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["normal","invalid-url"],"default":"normal"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const bad = (this.props.state ?? 'normal') === 'invalid-url';
    const nav = [['profile', 'Profile', 'SettingsProfile.dc.html'], ['providers', 'Provider Connections', 'SettingsProviders.dc.html'], ['agents', 'Agent Models', 'SettingsAgents.dc.html'], ['prefs', 'Preferences', 'SettingsPreferences.dc.html']];
    return {
      isInvalid: bad, invalid: bad ? 'true' : 'false', urlBorder: bad ? '#BE123C' : '#DBD3C7',
      nav: nav.map(([k, label, href]) => ({ label, href, current: k === 'profile' ? 'page' : 'false', w: k === 'profile' ? 600 : 500, bg: k === 'profile' ? '#E5DED5' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
