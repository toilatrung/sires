<html lang="vi">
<head>
<meta charset="utf-8">
<title>SIRes — Pending Actions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F2EE}
a{color:#025FAC}a:hover{color:#1C1B18}
</style>
</helmet>
<div style="min-height: 1000px; background: #F6F2EE; color: #1C1B18; font-family: Montserrat, system-ui, sans-serif">
  <dc-import name="TopBar" mode="global" active="pending" hint-size="100%,57px"></dc-import>
  <div style="max-width: 1280px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 32px) 64px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
    <aside aria-label="Lọc theo loại" style="flex: 1 1 220px; max-width: 260px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="8">
        <a href="#" aria-current="{{t.current}}" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: {{t.w}}; color: #1C1B18; background: {{t.bg}}"><span>{{t.label}}</span><span style="font-variant-numeric: tabular-nums; font-size: 12px; color: #4D4A44">{{t.n}}</span></a>
      </sc-for>
    </aside>
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
        <h1 style="margin: 0; font-family: Montserrat, system-ui, sans-serif; font-weight: 600; font-size: 26px">Pending Actions</h1>
        <span style="font-size: 13px; color: #4D4A44">Phát sinh sớm nhất ở trên · mở một việc để xử lý trong đúng ngữ cảnh</span>
      </div>
      <ol style="margin: 0; padding: 0; list-style: none; background: #FCF9F5; border: 1px solid #DBD3C7; border-radius: 8px">
        <sc-for list="{{items}}" as="p" hint-placeholder-count="6">
          <li style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 16px 18px; border-top: {{p.div}}">
            <span style="flex: 0 0 96px; font-variant-numeric: tabular-nums; font-size: 12px; color: #4D4A44">{{p.time}}</span>
            <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 4px; background: #EAF4FE; color: #025FAC; border: 1px solid #80B9EE; font-size: 11px; font-weight: 600"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>{{p.kind}}</span><span style="font-size: 13px; color: #4D4A44">{{p.project}}</span></span>
              <span style="font-size: 15px; font-weight: 600; line-height: 1.4">{{p.title}}</span>
            </div>
            <a href="{{p.href}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border: 1px solid #0277DD; border-radius: 6px; color: #025FAC; text-decoration: none; font-size: 14px; font-weight: 600">{{p.cta}}</a>
          </li>
        </sc-for>
      </ol>

      <section aria-labelledby="ex" style="display: flex; flex-direction: column; gap: 10px">
        <h2 id="ex" style="margin: 0; font-family: Montserrat, system-ui, sans-serif; font-weight: 600; font-size: 21px">Hết hiệu lực · 2</h2>
        <ul style="margin: 0; padding: 0; list-style: none; background: #F6F2EE; border: 1px dashed #4D4A44; border-radius: 8px">
          <sc-for list="{{expired}}" as="e" hint-placeholder-count="2">
            <li style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px 18px; border-top: {{e.div}}">
              <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 14px; font-weight: 600; color: #4D4A44">{{e.title}}</span>
                <span style="font-size: 13px; line-height: 1.45">{{e.reason}} <strong>Không được tính là đồng ý.</strong></span>
              </div>
              <button style="height: 36px; padding: 0 12px; border: 1px solid #DBD3C7; border-radius: 6px; background: #FCF9F5; color: #1C1B18; font: 500 13px Montserrat, sans-serif">Đánh dấu đã xem</button>
            </li>
          </sc-for>
        </ul>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const P1 = 'RAG trong tổng quan tài liệu', P2 = 'Độ tin cậy của LLM trong giáo dục';
    const div = (i) => i === 0 ? '0' : '1px solid #DBD3C7';
    const types = [['Tất cả', 6], ['Plan approval', 2], ['Interactive Agent Prompt', 1], ['Reference approval', 1], ['Task review request', 1], ['Manual work required', 0], ['Manuscript change proposal', 1], ['Recovery decision', 0]];
    return {
      types: types.map(([label, n], i) => ({ label, n: String(n), current: i === 0 ? 'page' : 'false', w: i === 0 ? 600 : 500, bg: i === 0 ? '#E5DED5' : 'transparent' })),
      items: [
        { time: '29/10 16:20', kind: 'Plan approval', project: P2, title: 'Duyệt Plan Version v1 — 2 Phase, 8 Task', cta: 'Mở để duyệt', href: 'PlanCompare.dc.html' },
        { time: '31/10 08:10', kind: 'Plan approval', project: P1, title: 'Duyệt Plan Version v4 — thay đổi lớn so với baseline v3', cta: 'Mở để duyệt', href: 'PlanCompare.dc.html' },
        { time: '31/10 09:05', kind: 'Reference approval', project: 'Trusted Library', title: '5 reference chờ duyệt theo lô', cta: 'Duyệt', href: 'Library.dc.html' },
        { time: '31/10 09:20', kind: 'Change proposal', project: P1, title: 'Writing Agent đề xuất sửa mục 1 Introduction', cta: 'Xem diff', href: 'Manuscript.dc.html' },
        { time: '31/10 09:31', kind: 'Task review', project: P1, title: 'Nghiệm thu T-2.1 Tổng hợp định nghĩa khái niệm', cta: 'Review', href: 'TaskReview.dc.html' },
        { time: '31/10 09:42', kind: 'Agent Prompt', project: P1, title: 'Discovery Agent: chọn phạm vi năm xuất bản cho T-2.3', cta: 'Trả lời', href: 'Chat.dc.html' }
      ].map((p, i) => ({ ...p, div: div(i) })),
      expired: [
        { title: 'Discovery Agent hỏi nguồn bổ sung cho T-1.3 · ' + P1, reason: 'Cancelled: workflow đã bị hủy.' },
        { title: 'Writing Agent đề xuất sửa mục 2 · ' + P1, reason: 'Outdated: main.tex đã đổi so với revision gốc.' }
      ].map((e, i) => ({ ...e, div: div(i) }))
    };
  }
}
</script>
</body>
</html>
