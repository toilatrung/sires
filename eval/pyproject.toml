[project]
name = "sires-eval"
version = "0.0.0"
description = "SIRes eval harness (NFR-EVAL-001-004)"
requires-python = ">=3.12,<3.13"
dependencies = ["sires-agent-core", "sires-knowledge"]

[tool.uv.sources]
sires-agent-core = { workspace = true }
sires-knowledge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sires_eval"]
